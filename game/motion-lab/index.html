<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Lab · KP Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b10; --card: #15151d; --card2: #1e1e29; --line: #2c2c3a;
  --text: #f5f5f7; --muted: #a1a1ae; --dim: #6e6e7c;
  --acc: #4f8cff; --lab: #ff9f0a; --ana: #bf5af2; --rev: #30d158; --duel: #ff375f;
  --good: #30d158; --bad: #ff453a; --gold: #ffd60a;
  --va: #ff7a45; --vb: #5aa2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { overflow-x: clip; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "IBM Plex Sans Thai", "Helvetica Neue", sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: rgba(11,11,16,.78); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid var(--line);
}
.top .brand { font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
.top .brand i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--acc), var(--ana)); display: grid; place-items: center; }
.top .sp { flex: 1; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--card2); font-size: 13px; font-weight: 600; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card2); display: grid; place-items: center; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; }
.eyebrow { color: var(--lab); font-weight: 600; font-size: 14px; }
h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.3; margin: 4px 0 8px; font-weight: 700; }
h2 { font-size: 22px; line-height: 1.35; margin: 28px 0 12px; }
.grad { background: linear-gradient(90deg, #ffb340, #ff6482 45%, #8f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--muted); }
.card { background: var(--card); border-radius: 20px; padding: 18px; }
.note-bar { margin-bottom: 18px; padding: 12px 16px; font-size: 14px; color: var(--muted); border: 1px solid var(--line); }
.note-bar a { color: var(--acc); }
.player { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.rank { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-weight: 700; font-size: 13px; text-align: center; line-height: 1.3; }
.bar { height: 8px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--acc), var(--ana)); }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.gcard { text-align: left; border: 0; background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; transition: transform .15s; }
.gcard:hover { transform: translateY(-2px); }
.gcard .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; }
.gcard .ic svg.i { width: 22px; height: 22px; }
.gcard b { font-size: 17px; }
.gcard small { color: var(--muted); font-size: 13px; line-height: 1.45; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; align-self: flex-start; }
.t-lab { color: var(--lab); background: rgba(255,159,10,.12); }
.t-ana { color: var(--ana); background: rgba(191,90,242,.14); }
.t-rev { color: var(--rev); background: rgba(48,209,88,.12); }
.t-duel { color: var(--duel); background: rgba(255,55,95,.13); }
.stars { color: var(--gold); font-size: 13px; font-weight: 600; }
.topics { display: grid; gap: 10px; }
.topic { display: grid; grid-template-columns: 44px 1fr 52px; gap: 10px; align-items: center; font-size: 14px; }
.topic .n { color: var(--muted); font-weight: 600; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.lv { border: 0; background: var(--card); border-radius: 18px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 104px; }
.lv[disabled] { opacity: .35; cursor: not-allowed; }
.lv .num { font-size: 13px; color: var(--muted); font-weight: 600; }
.lv .ttl { font-weight: 600; line-height: 1.4; }
.back { border: 0; background: none; color: var(--acc); padding: 0; display: inline-flex; gap: 4px; align-items: center; font-weight: 600; }
.btn { border: 0; border-radius: 99px; padding: 10px 20px; font-weight: 600; background: var(--acc); color: #fff; }
.btn.ghost { background: var(--card2); color: var(--text); }
.btn.big { padding: 13px 26px; font-size: 17px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.play-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.play-head .t { font-weight: 700; font-size: 18px; flex: 1; min-width: 180px; line-height: 1.4; }
.hud { font-size: 14px; color: var(--muted); font-weight: 600; }
.brief { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; line-height: 1.6; }
.brief b { color: var(--gold); }
canvas.stage { display: block; width: 100%; border-radius: 18px; background: #101018; touch-action: none; }
.ctrl { display: grid; gap: 10px; margin-top: 12px; }
.slider { display: grid; grid-template-columns: 110px 1fr 76px; gap: 10px; align-items: center; font-size: 14px; }
.slider output { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.slider.locked { opacity: .45; }
input[type=range] { width: 100%; accent-color: var(--acc); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.readout div { background: var(--card); border-radius: 12px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
.readout b { display: block; color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--card2); border-radius: 99px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 6px 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--acc); color: #fff; }
/* overlay */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ov .box { background: var(--card); border-radius: 24px; padding: 24px; width: min(440px, 100%); text-align: center; animation: pop .25s ease-out; }
.ov .big-stars { font-size: 40px; letter-spacing: 6px; color: var(--gold); }
.ov .big-stars .off { color: var(--line); }
.ov .note { background: var(--card2); border-radius: 14px; padding: 12px; text-align: left; font-size: 14px; line-height: 1.6; margin: 14px 0; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--card2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); line-height: 1.5; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); }
/* cards / domino / spot */
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mc { border: 0; aspect-ratio: 4/3.2; border-radius: 14px; background: var(--card2); padding: 8px; font-size: 14px; font-weight: 600; line-height: 1.4; display: grid; place-items: center; transition: transform .2s, background .2s; overflow-wrap: anywhere; }
.mc.back { background: linear-gradient(135deg, #22223a, #2b1f3d); color: transparent; }
.mc.back::after { content: "?"; color: var(--dim); font-size: 22px; }
.mc.up { background: #26324d; }
.mc.done { background: rgba(48,209,88,.16); color: #9cf0b4; }
.mc.nope { background: rgba(255,69,58,.2); }
.chainbox { display: flex; flex-direction: column; gap: 8px; }
.dom { display: grid; grid-template-columns: 1fr 1fr; border-radius: 14px; overflow: hidden; background: var(--card2); font-size: 14px; line-height: 1.45; border: 0; padding: 0; text-align: left; }
.dom > span { padding: 10px 12px; }
.dom > span:first-child { background: rgba(79,140,255,.14); font-weight: 700; }
.dom.placed > span:first-child { background: rgba(48,209,88,.16); color: #9cf0b4; }
.dom.open { outline: 2px dashed var(--acc); outline-offset: 2px; }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 14px; }
.tray .dom.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.para { background: var(--card); border-radius: 18px; padding: 18px; font-size: 18px; line-height: 2.1; }
.para .w { border: 0; background: none; padding: 2px 3px; border-radius: 6px; color: var(--text); font-size: inherit; line-height: inherit; }
.para .w:hover { background: var(--card2); }
.para .w.miss { background: rgba(255,69,58,.18); }
.para .w.fixed { background: rgba(48,209,88,.18); color: #9cf0b4; font-weight: 600; }
.picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
/* duel */
.duel { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: 1fr auto 1fr; }
.half { padding: 14px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.half.p1 { transform: rotate(180deg); background: rgba(255,55,95,.07); }
.half.p2 { background: rgba(79,140,255,.07); }
.half .q { font-size: 16px; font-weight: 600; line-height: 1.5; }
.half .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.half .opts button { border: 0; border-radius: 12px; background: var(--card2); padding: 10px; font-size: 14px; line-height: 1.4; min-height: 52px; }
.half.locked .opts button { opacity: .3; }
.half .opts button.ok { background: rgba(48,209,88,.3); }
.half .opts button.no { background: rgba(255,69,58,.3); }
.mid { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 6px; font-weight: 700; border-block: 1px solid var(--line); }
.mid .s1 { color: var(--duel); } .mid .s2 { color: var(--acc); }
@media (max-width: 560px) {
  .mem { grid-template-columns: repeat(3, 1fr); }
  .mc { font-size: 13px; aspect-ratio: auto; min-height: 76px; }
  .slider { grid-template-columns: 84px 1fr 64px; }
  .para { font-size: 16px; padding: 14px; }
  .dom { font-size: 13px; }
}
</style>
</head>

  <span class="sp"></span>
  <span class="chip" id="xpChip"></span>
  <button class="icon-btn" id="sndBtn" aria-label="เปิด/ปิดเสียง"></button>
</header>
