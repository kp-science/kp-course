<!DOCTYPE html>
<html lang="th">
<head>

<title>หน้าครู · คอร์สออนไลน์ KP Science</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#06090f;--bg2:#0d1117;--bg3:#161b27;--bg4:#1c2333;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --accent:#38bdf8;--accent2:#818cf8;--accent3:#34d399;--accent4:#fb923c;--accent5:#f472b6;--danger:#f87171;
  --text:#f0f4f8;--text2:#c3cfdc;--muted:#7c8fa6;
  --head:'IBM Plex Sans Thai',sans-serif;--mono:'Share Tech Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',sans-serif;overflow-x:hidden}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;background:rgba(6,9,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.top b{font:700 16px var(--head)}.top b span{color:var(--accent)}
.top .sp{flex:1}
.top small{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13.5px var(--head);padding:7px 13px;border-radius:7px;border:1px solid var(--border2);background:var(--bg3);text-decoration:none;cursor:pointer;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#06090f}
.btn.ok{background:var(--accent3);border-color:var(--accent3);color:#06090f}
.btn.bad{border-color:rgba(248,113,113,.4);color:var(--danger)}
.btn.bad:hover{background:rgba(248,113,113,.12)}
.btn.xs{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.gate{max-width:420px;margin:12vh auto;padding:30px;border:1px solid var(--border2);border-radius:14px;background:var(--bg2);text-align:center;display:flex;flex-direction:column;gap:12px}
.gate h1{font:700 22px var(--head)}
.gate p{color:var(--muted);font-size:14px}
.gate input{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;width:100%}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 52px)}
.side{border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg2)}
.side h3{font:700 12px var(--head);letter-spacing:.1em;color:var(--muted);margin-top:6px}
.citem{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--bg3);border-radius:9px;padding:9px 11px;cursor:pointer}
.citem:hover{border-color:var(--border2)}
.citem.on{border-color:var(--accent);background:rgba(56,189,248,.08)}
.citem b{display:block;font:600 14px/1.4 var(--head)}
.citem small{color:var(--muted);font-size:12px}
.badge{display:inline-block;font:700 11px var(--head);padding:1px 7px;border-radius:99px;background:var(--accent4);color:#06090f;margin-left:4px}
.badge.g{background:var(--bg4);color:var(--muted)}
.badge.pub{background:rgba(52,211,153,.15);color:var(--accent3)}
.main{padding:22px 26px 60px;min-width:0}
.main h1{font:700 24px/1.35 var(--head)}
.sub{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 18px;border-bottom:1px solid var(--border);padding-bottom:10px}
.tabs button{border:1px solid var(--border2);background:var(--bg2);border-radius:7px;padding:6px 13px;font:600 13.5px var(--head);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#06090f}
.card{border:1px solid var(--border2);border-radius:12px;background:var(--bg2);padding:18px;margin-bottom:16px}
.card h2{font:700 17px var(--head);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.f label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.f input[type=text],.f input[type=url],.f input[type=number],.f input[type=email],.f textarea,.f select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;outline:none}
.f input:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:90px;resize:vertical;font-family:var(--mono),monospace;font-size:13.5px;line-height:1.55}
.f textarea.tall{min-height:260px}
.f .hint{font-size:12px;color:var(--muted);margin-top:3px}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font:600 12px var(--head);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
td .mono{font-family:var(--mono)}
.tw{overflow-x:auto}
.pbar{width:120px;height:6px;border-radius:9px;background:var(--bg4);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3))}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--bg3);margin-bottom:6px}
.lrow .n{font:700 12px var(--mono);color:var(--muted);width:26px;text-align:center}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font:600 14px var(--head)}
.lrow .t small{color:var(--muted);font-size:12px}
.lrow.on{border-color:var(--accent)}
.prev{border:1px dashed var(--border2);border-radius:10px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:1.8;color:var(--text2)}
.prev h2{font:700 19px var(--head);margin:.8em 0 .3em;color:var(--text)}
.prev h3{font:700 16px var(--head);margin:.8em 0 .3em;color:var(--text)}
.prev ul,.prev ol{padding-left:1.3em;margin:0 0 .8em}
.prev blockquote{padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg3);margin:.8em 0}
.prev p{margin:0 0 .8em}
.prev .embed{position:relative;aspect-ratio:16/9;border:1px solid var(--border2);border-radius:8px;overflow:hidden;margin:.8em 0;background:#fff}
.prev .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prev .embed-cap{font-size:12px;text-align:right;margin-top:-.4em}
.prev .lbtn{display:inline-block;padding:6px 12px;border:1px solid var(--accent);border-radius:7px;text-decoration:none}
.prev img{max-width:100%}
.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--border2);border-radius:10px}
.note{font-size:13px;color:var(--muted);background:var(--bg3);border-radius:8px;padding:9px 12px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);background:var(--bg4);border:1px solid var(--accent);padding:9px 18px;border-radius:9px;transition:.3s;z-index:90;opacity:0;font-weight:600;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--border)}
  .main{padding:18px 16px 50px}
  .form{grid-template-columns:1fr}
  .top{padding:0 16px}
}
</style>
</head>
<body>
<header class="top">
  <b>📚 คอร์สออนไลน์ · <span>หน้าครู</span></b>
  <span class="sp"></span>
  <a class="btn xs" href="index.html" target="_blank" rel="noopener">ดูหน้าเรียน ↗</a>
  <small id="who"></small>
  <button class="btn xs hide" id="outBtn" type="button">ออก</button>
</header>

<div id="gate" class="gate hide">
  <h1>🔐 หน้าครู</h1>
  <p>เข้าสู่ระบบด้วย Google บัญชีครู (komanepapato@gmail.com)</p>
  <button class="btn solid" type="button" id="gBtn">เข้าสู่ระบบด้วย Google</button>
  <div class="err" id="gErr"></div>
</div>

<div id="appWrap" class="layout hide">
  <aside class="side">
    <button class="btn solid" type="button" data-act="new-course">＋ คอร์สใหม่</button>
    <label class="btn" style="cursor:pointer">📥 นำเข้า courses.js / JSON<input type="file" id="importFile" accept=".js,.json,application/json,text/javascript" hidden></label>
    <h3>คอร์สทั้งหมด</h3>
    <div id="clist"><div class="sub">กำลังโหลด…</div></div>
    <h3>คำขอสิทธิ์รออนุมัติ</h3>
    <div id="reqAll" class="sub">—</div>
  </aside>
  <main class="main" id="main"><div class="empty">เลือกคอร์สทางซ้าย หรือสร้างคอร์สใหม่</div></main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=2"></script>
<script src="course-core.js?v=1"></script>
<script>
(function () {
const { esc, renderBody, typeset } = KPC;
const A = KPC.admin;
const $ = id => document.getElementById(id);
const auth = KPC.auth, db = KPC.db;
const SUBJECTS = ['ฟิสิกส์', 'ดาราศาสตร์', 'เคมี', 'ชีววิทยา', 'วิทยาศาสตร์ทั่วไป'];
const LEVELS = ['ม.4', 'ม.5', 'ม.6', 'ม.ปลาย', 'ม.1', 'ม.2', 'ม.3', 'ม.ต้น', 'มหาวิทยาลัย', 'ทุกระดับ'];
function toast(m) { const t = $('toast'); t.textContent = m; t.className = 'toast show'; clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }
const fmtTime = ts => { try { const d = ts && ts.toDate ? ts.toDate() : null; return d ? d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'; } catch (e) { return '—'; } };
const slug = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
const fail = e => toast('❌ ' + (e.code === 'permission-denied' ? 'ไม่มีสิทธิ์เขียน (ตรวจ Firestore rules ว่า deploy แล้ว)' : (e.message || e)));

/* ===================== สถานะ ===================== */
const S = { courses: [], requests: [], cur: null, tab: 'info', lessons: [], editLid: null, students: null, progress: null };

/* ===================== ล็อกอิน ===================== */
$('gBtn').onclick = async () => { try { await KPC.loginGoogle(); } catch (e) { $('gErr').textContent = e.code === 'auth/popup-closed-by-user' ? '' : KPC.authError(e.code); } };
$('outBtn').onclick = () => KPC.logout();

if (!KPC.configured) {
  $('gate').classList.remove('hide');
  $('gate').innerHTML = '<h1>⚙️ ตั้งค่าเว็บ</h1><p>ยังไม่ได้ใส่ค่า Firebase ของเว็บคอร์ส — เปิดไฟล์ <b>firebase-config.js</b> แล้ววาง firebaseConfig ของโปรเจกต์คอร์ส</p>';
} else KPC.onUser(async user => {
  const ok = KPC.isTeacher();
  $('gate').classList.toggle('hide', ok);
  $('appWrap').classList.toggle('hide', !ok);
  $('outBtn').classList.toggle('hide', !user);
  $('who').textContent = user ? user.email : '';
  $('gErr').textContent = user && !ok ? 'บัญชี ' + user.email + ' ไม่ใช่บัญชีครู (ต้องล็อกอินด้วย Google ของครู)' : '';
  if (ok) { await refreshAll(); routeFromHash(); }
});

async function refreshAll() {
  try { S.courses = await KPC.listCourses(true); } catch (e) { S.courses = []; fail(e); }
  try { S.requests = await A.requests(); } catch (e) { S.requests = []; }
  drawSide();
}
function routeFromHash() {
  const m = /^#c\/(.+)$/.exec(decodeURIComponent(location.hash));
  if (m && S.courses.some(c => c.id === m[1])) openCourse(m[1]);
  else if (S.cur) openCourse(S.cur.id, S.tab);
}

/* ===================== แถบซ้าย ===================== */
function drawSide() {
  const reqN = cid => S.requests.filter(r => r.courseId === cid).length;
  $('clist').innerHTML = S.courses.map(c => `<button class="citem${S.cur && S.cur.id === c.id ? ' on' : ''}" type="button" data-open="${esc(c.id)}">
      <b>${esc(c.title || c.id)}</b><small>${(c.outline || []).length} บท · ${c.published ? '<span class="badge pub">เผยแพร่</span>' : '<span class="badge g">ร่าง</span>'}${reqN(c.id) ? `<span class="badge">${reqN(c.id)} คำขอ</span>` : ''}</small></button>`).join('')
    || '<div class="sub">ยังไม่มีคอร์ส — กด “＋ คอร์สใหม่” หรือ “นำเข้า”</div>';
  $('reqAll').innerHTML = S.requests.length
    ? S.requests.map(r => `<div style="margin-bottom:6px"><b style="color:var(--text)">${esc(r.email)}</b><br>${esc((S.courses.find(c => c.id === r.courseId) || {}).title || r.courseId)}</div>`).join('')
    : 'ไม่มีคำขอค้าง';
}

/* ===================== หน้าคอร์ส ===================== */
async function openCourse(cid, tab) {
  S.cur = S.courses.find(c => c.id === cid) || null;
  if (!S.cur) return;
  S.tab = tab || 'info'; S.editLid = null; S.students = null; S.progress = null;
  history.replaceState(null, '', '#c/' + encodeURIComponent(cid));
  drawSide();
  try { S.lessons = await KPC.listLessons(cid); } catch (e) { S.lessons = []; fail(e); }
  drawMain();
}

function drawMain() {
  const c = S.cur; if (!c) return;
  const reqN = S.requests.filter(r => r.courseId === c.id).length;
  const T = [['info', '⚙️ ข้อมูลคอร์ส'], ['lessons', `📖 บทเรียน (${S.lessons.length})`], ['students', `👥 นักเรียน / สิทธิ์${reqN ? ' · ' + reqN + ' คำขอ' : ''}`], ['progress', '📊 ความคืบหน้า']];
  $('main').innerHTML = `
    <div class="row"><div><h1>${esc(c.title || c.id)}</h1><div class="sub">รหัสคอร์ส <span class="mono">${esc(c.id)}</span> · ${c.published ? 'เผยแพร่แล้ว' : 'ร่าง (นักเรียนยังไม่เห็น)'}</div></div><span class="sp"></span>
      <a class="btn" href="index.html#/c/${encodeURIComponent(c.id)}" target="_blank" rel="noopener">เปิดหน้าเรียน ↗</a></div>
    <div class="tabs">${T.map(t => `<button type="button" data-tab="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div>
    <div id="pane"></div>`;
  ({ info: drawInfo, lessons: drawLessons, students: drawStudents, progress: drawProgress })[S.tab]();
}

/* ---------- ข้อมูลคอร์ส ---------- */
function courseForm(c, isNew) {
  const opt = (list, v) => list.concat(v && !list.includes(v) ? [v] : []).map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('');
  return `<div class="form" id="cform">
    <div class="f"><label>รหัสคอร์ส (a-z 0-9 -)</label><input type="text" name="id" value="${esc(c.id || '')}" ${isNew ? '' : 'readonly'} placeholder="เช่น kp-mechanics-m4"><div class="hint">${isNew ? 'ใช้ในลิงก์ของคอร์ส — เปลี่ยนภายหลังไม่ได้' : 'เปลี่ยนไม่ได้'}</div></div>
    <div class="f"><label>ชื่อคอร์ส</label><input type="text" name="title" value="${esc(c.title || '')}"></div>
    <div class="f"><label>สาขา</label><select name="subject">${opt(SUBJECTS, c.subject || 'ฟิสิกส์')}</select></div>
    <div class="f"><label>ระดับชั้น</label><select name="level">${opt(LEVELS, c.level || 'ม.4')}</select></div>
    <div class="f"><label>ผู้สอน</label><input type="text" name="author" value="${esc(c.author || 'ครูโกเมน ปาปะโถ')}"></div>
    <div class="f"><label>ลำดับการแสดง (น้อยขึ้นก่อน)</label><input type="number" name="order" value="${esc(c.order || 0)}"></div>
    <div class="f full"><label>คำโปรย (แสดงบนการ์ด)</label><input type="text" name="summary" value="${esc(c.summary || '')}"></div>
    <div class="f full"><label>ภาพปก (ลิงก์ ถ้ามี)</label><input type="url" name="cover" value="${esc(c.cover || '')}" placeholder="https://…"></div>
    <div class="f full"><label>คำแนะนำคอร์ส (แสดงเหนือบทที่ 1 · ทุกคนอ่านได้)</label><textarea name="body">${esc(c.body || '')}</textarea></div>
    <div class="f full"><label class="chk"><input type="checkbox" name="published"${c.published ? ' checked' : ''}> เผยแพร่ (นักเรียนเห็นคอร์สนี้ในหน้ารายการ)</label></div>
  </div>`;
}
function readCourseForm() {
  const f = $('cform'), v = n => f.querySelector(`[name="${n}"]`);
  return { id: slug(v('id').value), title: v('title').value.trim(), subject: v('subject').value, level: v('level').value, author: v('author').value.trim(),
    order: Number(v('order').value) || 0, summary: v('summary').value.trim(), cover: v('cover').value.trim(), body: v('body').value, published: v('published').checked };
}
function drawInfo() {
  $('pane').innerHTML = `<div class="card"><h2>ข้อมูลคอร์ส</h2>${courseForm(S.cur)}
    <div class="row" style="margin-top:14px"><button class="btn solid" type="button" data-act="save-course">💾 บันทึก</button><span class="sp"></span><button class="btn bad" type="button" data-act="del-course">🗑 ลบคอร์ส</button></div></div>
    <div class="note">ข้อมูลในแท็บนี้ + รายชื่อบท (ไม่รวมเนื้อหา) ทุกคนเห็นได้เมื่อเผยแพร่ ส่วนเนื้อหาบท คลิป เอกสาร แบบทดสอบ เปิดเฉพาะนักเรียนที่ครูให้สิทธิ์คอร์สนี้ หรือบทที่ติ๊ก “ทดลองเรียนฟรี”</div>`;
}
function drawNewCourse() {
  S.cur = null; drawSide();
  history.replaceState(null, '', '#');
  $('main').innerHTML = `<div class="card"><h2>＋ คอร์สใหม่</h2>${courseForm({ published: false }, true)}
    <div class="row" style="margin-top:14px"><button class="btn solid" type="button" data-act="create-course">สร้างคอร์ส</button></div></div>`;
}

/* ---------- บทเรียน ---------- */
function drawLessons() {
  const L = S.lessons;
  const edit = S.editLid ? (L.find(l => l.id === S.editLid) || { id: S.editLid, _new: true, order: L.length + 1, unit: (L[L.length - 1] || {}).unit || '' }) : null;
  $('pane').innerHTML = `<div class="card"><h2>บทเรียน <span class="sp"></span><button class="btn solid xs" type="button" data-act="new-lesson">＋ เพิ่มบท</button></h2>
    ${L.map((l, i) => `<div class="lrow${S.editLid === l.id ? ' on' : ''}"><span class="n">${i + 1}</span><span class="t"><b>${esc(l.title || '(ไม่มีชื่อ)')}</b><small>${esc(l.unit || '')}${l.dur ? ' · ' + esc(l.dur) : ''}${l.video ? ' · 🎬 คลิป' : ''}${l.free ? ' · <span style="color:var(--accent3)">ฟรี</span>' : ''}</small></span>
      <button class="btn xs" type="button" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button class="btn xs" type="button" data-down="${i}" ${i < L.length - 1 ? '' : 'disabled'}>↓</button>
      <button class="btn xs" type="button" data-edit="${esc(l.id)}">แก้</button></div>`).join('') || '<div class="empty">ยังไม่มีบทเรียน</div>'}
    </div>${edit ? lessonForm(edit) : ''}`;
  if (edit) { $('lform').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
function lessonForm(l) {
  return `<div class="card" id="lform"><h2>${l._new ? '＋ บทใหม่' : '✏️ แก้บท: ' + esc(l.title)}</h2><div class="form">
    <div class="f"><label>หน่วย (บทที่อยู่หน่วยเดียวกันจะรวมกลุ่ม)</label><input type="text" name="unit" value="${esc(l.unit || '')}" placeholder="01 การเคลื่อนที่"></div>
    <div class="f"><label>ชื่อบท</label><input type="text" name="title" value="${esc(l.title || '')}"></div>
    <div class="f"><label>คลิป YouTube (ตั้งเป็น Unlisted ได้)</label><input type="url" name="video" value="${esc(l.video || '')}" placeholder="https://youtu.be/…"></div>
    <div class="f"><label>ความยาวคลิป</label><input type="text" name="dur" value="${esc(l.dur || '')}" placeholder="12:30"></div>
    <div class="f"><label>เอกสาร (ลิงก์ Drive/PDF)</label><input type="url" name="file" value="${esc(l.file || '')}"></div>
    <div class="f"><label>แบบทดสอบ (ลิงก์ Google Form ฯลฯ)</label><input type="url" name="quiz" value="${esc(l.quiz || '')}"></div>
    <div class="f full"><label>เนื้อหา</label><textarea class="tall" name="body">${esc(l.body || '')}</textarea>
      <div class="hint">## หัวข้อ · - รายการ · &gt; กล่องเน้น · **หนา** · $สมการ$ · [ฝัง: ลิงก์ซิมูเลชัน | ชื่อ] · [รูป: ลิงก์ | คำบรรยาย] · [ลิงก์: ข้อความ | ลิงก์] — ซิม Demo ฝังในหน้าได้ · Virtual Lab จะเป็นปุ่มเปิดแท็บใหม่</div></div>
    <div class="f full"><label class="chk"><input type="checkbox" name="free"${l.free ? ' checked' : ''}> ทดลองเรียนฟรี (คนที่ยังไม่มีสิทธิ์ก็เปิดบทนี้ได้)</label></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn solid" type="button" data-act="save-lesson" data-lid="${esc(l.id)}">💾 บันทึกบท</button><button class="btn" type="button" data-act="preview-lesson">👁 ดูตัวอย่างเนื้อหา</button><button class="btn" type="button" data-act="close-lesson">ปิด</button><span class="sp"></span>${l._new ? '' : `<button class="btn bad" type="button" data-act="del-lesson" data-lid="${esc(l.id)}">🗑 ลบบท</button>`}</div>
  <div id="lprev"></div></div>`;
}
function readLessonForm() {
  const f = $('lform'), v = n => f.querySelector(`[name="${n}"]`);
  return { unit: v('unit').value.trim(), title: v('title').value.trim(), video: v('video').value.trim(), dur: v('dur').value.trim(),
    file: v('file').value.trim(), quiz: v('quiz').value.trim(), body: v('body').value, free: v('free').checked };
}
async function afterLessonChange(msg) {
  try {
    const outline = await A.syncOutline(S.cur.id);
    S.cur.outline = outline; S.cur.lessonCount = outline.length;
    S.lessons = await KPC.listLessons(S.cur.id);
    toast(msg);
  } catch (e) { fail(e); }
  drawSide(); drawMain();
}
async function moveLesson(i, d) {
  const L = S.lessons.slice(), j = i + d; if (j < 0 || j >= L.length) return;
  [L[i], L[j]] = [L[j], L[i]];
  try {
    const batch = db.batch(), ref = id => A.lessonRef(S.cur.id, id);
    L.forEach((l, k) => { if (l.order !== k + 1) batch.update(ref(l.id), { order: k + 1 }); });
    await batch.commit();
    await afterLessonChange('เรียงลำดับแล้ว');
  } catch (e) { fail(e); }
}

/* ---------- นักเรียน / สิทธิ์ ---------- */
async function drawStudents() {
  const c = S.cur;
  $('pane').innerHTML = '<div class="empty">กำลังโหลดรายชื่อ…</div>';
  if (!S.students) { try { S.students = await A.studentsOf(c.id); } catch (e) { S.students = []; fail(e); } }
  const reqs = S.requests.filter(r => r.courseId === c.id);
  $('pane').innerHTML = `
    <div class="card"><h2>🙋 คำขอสิทธิ์ (${reqs.length})</h2>
      ${reqs.length ? `<div class="tw"><table><tr><th>อีเมล</th><th>ข้อความถึงครู</th><th>เมื่อ</th><th></th></tr>
        ${reqs.map(r => `<tr><td>${esc(r.email)}${r.name ? '<br><small style="color:var(--muted)">' + esc(r.name) + '</small>' : ''}</td><td>${esc(r.note || '—')}</td><td>${fmtTime(r.createdAt)}</td>
          <td class="row" style="justify-content:flex-end"><button class="btn ok xs" type="button" data-approve="${esc(r.id)}">✓ อนุมัติ</button><button class="btn bad xs" type="button" data-reject="${esc(r.id)}">✕ ไม่อนุมัติ</button></td></tr>`).join('')}</table></div>` : '<div class="sub">ไม่มีคำขอค้าง</div>'}
    </div>
    <div class="card"><h2>➕ ให้สิทธิ์ด้วยอีเมล</h2>
      <div class="row"><div class="f" style="flex:1;min-width:220px"><input type="email" id="grantEmail" placeholder="อีเมลที่นักเรียนใช้สมัครเว็บคอร์ส"></div><button class="btn solid" type="button" data-act="grant">ให้สิทธิ์เข้าคอร์ส</button></div>
      <div class="note" style="margin-top:10px">นักเรียนต้องสมัคร/เข้าสู่ระบบเว็บคอร์สอย่างน้อย 1 ครั้งก่อน (อีเมลหรือ Google) จึงจะค้นเจอ</div>
    </div>
    <div class="card"><h2>👥 นักเรียนที่มีสิทธิ์ (${S.students.length})</h2>
      ${S.students.length ? `<div class="tw"><table><tr><th>อีเมล</th><th>ชื่อ</th><th></th></tr>
        ${S.students.sort((a, b) => String(a.email).localeCompare(String(b.email))).map(u => `<tr><td>${esc(u.email)}</td><td>${esc(u.name || '—')}</td>
          <td style="text-align:right">${u.via === c.id ? `<button class="btn bad xs" type="button" data-revoke="${esc(u.id)}">ถอนสิทธิ์</button>` : '<small style="color:var(--muted)">มีสิทธิ์ทุกคอร์ส (*)</small>'}</td></tr>`).join('')}</table></div>` : '<div class="sub">ยังไม่มีนักเรียน</div>'}
    </div>`;
}

/* ---------- ความคืบหน้า ---------- */
async function drawProgress() {
  const c = S.cur, outline = c.outline || [];
  $('pane').innerHTML = '<div class="empty">กำลังโหลดความคืบหน้า…</div>';
  try {
    if (!S.progress) S.progress = await A.progressOf(c.id);
    if (!S.students) S.students = await A.studentsOf(c.id);
  } catch (e) { fail(e); S.progress = S.progress || []; S.students = S.students || []; }
  const byUid = {};
  S.students.forEach(u => { byUid[u.id] = { email: u.email, done: [], last: '', lastAt: null, active: true }; });
  S.progress.forEach(p => { byUid[p.uid] = Object.assign(byUid[p.uid] || { email: p.email, active: false }, { done: p.done || [], last: p.last || '', lastAt: p.lastAt || p.updatedAt || null }); });
  const rows = Object.entries(byUid).map(([uid, r]) => {
    const n = r.done.filter(x => outline.some(l => l.id === x)).length;
    return Object.assign(r, { uid, n, pct: outline.length ? Math.round(n / outline.length * 100) : 0, lastTitle: ((outline.find(l => l.id === r.last) || {}).title) || '' });
  }).sort((a, b) => b.pct - a.pct || String(a.email).localeCompare(String(b.email)));
  S._rows = rows;
  const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.pct, 0) / rows.length) : 0;
  const perLesson = outline.map(l => rows.filter(r => r.done.includes(l.id)).length);
  $('pane').innerHTML = `
    <div class="card"><h2>📊 ภาพรวม · ${rows.length} คน · เฉลี่ย ${avg}% <span class="sp"></span><button class="btn xs" type="button" data-act="csv">⬇ CSV</button></h2>
      ${rows.length ? `<div class="tw"><table><tr><th>นักเรียน</th><th>เรียนแล้ว</th><th>บทล่าสุดที่เปิด</th><th>เมื่อ</th></tr>
      ${rows.map(r => `<tr><td>${esc(r.email)}${r.active ? '' : ' <small style="color:var(--danger)">(ถอนสิทธิ์แล้ว)</small>'}</td><td><span class="pbar"><i style="width:${r.pct}%"></i></span><span class="mono">${r.n}/${outline.length}</span> · ${r.pct}%</td><td>${esc(r.lastTitle || '—')}</td><td>${fmtTime(r.lastAt)}</td></tr>`).join('')}</table></div>` : '<div class="sub">ยังไม่มีข้อมูล</div>'}
    </div>
    <div class="card"><h2>📖 รายบท — จำนวนคนที่ติ๊ก “เรียนแล้ว”</h2>
      ${outline.map((l, i) => `<div class="lrow"><span class="n">${i + 1}</span><span class="t"><b>${esc(l.title)}</b></span><span class="pbar"><i style="width:${rows.length ? perLesson[i] / rows.length * 100 : 0}%"></i></span><span class="mono">${perLesson[i]}/${rows.length}</span></div>`).join('') || '<div class="sub">ยังไม่มีบท</div>'}
    </div>`;
}
function downloadCsv() {
  const outline = S.cur.outline || [], q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [['email', 'done', 'total', 'percent', 'last_lesson', 'last_at'].concat(outline.map((l, i) => 'L' + (i + 1) + ' ' + l.title)).map(q).join(',')];
  (S._rows || []).forEach(r => lines.push([r.email, r.n, outline.length, r.pct, r.lastTitle, r.lastAt && r.lastAt.toDate ? r.lastAt.toDate().toISOString() : ''].concat(outline.map(l => r.done.includes(l.id) ? 1 : 0)).map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }));
  a.download = 'progress-' + S.cur.id + '.csv'; a.click();
}

/* ---------- นำเข้า (courses.js ของต้นแบบ หรือ JSON) ---------- */
$('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let list;
  try {
    // ตัดบรรทัดคอมเมนต์ // ออกก่อน (คอมเมนต์หัวไฟล์ courses.js มี [ … ] อยู่)
    const txt = (await file.text()).replace(/^﻿/, '').split('\n').filter(l => !/^\s*\/\//.test(l)).join('\n');
    const json = txt.slice(txt.indexOf('['), txt.lastIndexOf(']') + 1);
    list = JSON.parse(/^\s*[\[{]/.test(txt) ? txt : json);
    if (!Array.isArray(list)) list = [list];
  } catch (err) { toast('อ่านไฟล์ไม่ได้ — ต้องเป็น JSON หรือ window.COURSES = [...]'); return; }
  for (const c of list) {
    const cid = slug(c.id || c.title);
    if (!cid) continue;
    if (S.courses.some(x => x.id === cid) && !confirm(`มีคอร์ส "${cid}" อยู่แล้ว — เขียนทับข้อมูลและบทเรียนทั้งหมด?`)) continue;
    try {
      if (S.courses.some(x => x.id === cid)) await A.deleteCourse(cid);
      await A.saveCourse(cid, { title: c.title || cid, subject: c.subject || 'ฟิสิกส์', level: c.level || '', author: c.author || '', summary: c.summary || '', body: c.body || '',
        cover: c.cover || '', order: Number(c.order) || 0, published: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      const batch = db.batch();
      (c.lessons || []).forEach((l, i) => {
        const lid = A.newLessonId(cid);
        batch.set(A.lessonRef(cid, lid), { order: i + 1, unit: l.unit || '', title: l.title || '', video: l.video || '', dur: l.dur || '',
          body: l.body || '', file: l.file || '', quiz: l.quiz || '', free: l.free === true || l.free === 'TRUE' });
      });
      await batch.commit();
      await A.syncOutline(cid);
      toast(`นำเข้า "${c.title}" แล้ว (${(c.lessons || []).length} บท · ยังเป็นร่าง)`);
    } catch (err) { fail(err); return; }
  }
  await refreshAll();
  if (list[0]) openCourse(slug(list[0].id || list[0].title), 'lessons');
});

/* ===================== ปุ่มต่าง ๆ ===================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('button,[data-open]'); if (!el) return;
  const d = el.dataset;
  if (d.open) return openCourse(d.open);
  if (d.tab) { S.tab = d.tab; S.editLid = null; return drawMain(); }
  if (d.edit) { S.editLid = d.edit; return drawLessons(); }
  if (d.up) return moveLesson(Number(d.up), -1);
  if (d.down) return moveLesson(Number(d.down), 1);
  if (d.approve || d.reject) {
    const r = S.requests.find(x => x.id === (d.approve || d.reject)); if (!r) return;
    el.disabled = true;
    try {
      if (d.approve) await A.grant(r.uid, r.courseId);
      await A.dropRequest(r.id);
      S.requests = S.requests.filter(x => x.id !== r.id); S.students = null;
      toast(d.approve ? `อนุมัติ ${r.email} แล้ว` : `ปฏิเสธคำขอของ ${r.email}`);
    } catch (err) { fail(err); }
    drawSide(); return drawMain();
  }
  if (d.revoke) {
    const u = (S.students || []).find(x => x.id === d.revoke);
    if (!u || !confirm(`ถอนสิทธิ์ ${u.email} ออกจากคอร์สนี้?`)) return;
    try { await A.revoke(u.id, S.cur.id); S.students = null; toast('ถอนสิทธิ์แล้ว (ความคืบหน้าเดิมยังเก็บไว้)'); } catch (err) { fail(err); }
    return drawMain();
  }
  switch (d.act) {
    case 'new-course': return drawNewCourse();
    case 'create-course': {
      const c = readCourseForm();
      if (!c.id || !c.title) return toast('ใส่รหัสคอร์สและชื่อคอร์สก่อน');
      if (S.courses.some(x => x.id === c.id)) return toast('รหัสนี้มีแล้ว');
      try { await A.saveCourse(c.id, Object.assign(c, { outline: [], lessonCount: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() })); await refreshAll(); openCourse(c.id, 'lessons'); toast('สร้างคอร์สแล้ว — เพิ่มบทเรียนต่อได้เลย'); } catch (err) { fail(err); }
      return;
    }
    case 'save-course': {
      const c = readCourseForm(); delete c.id;
      try { await A.saveCourse(S.cur.id, c); Object.assign(S.cur, c); drawSide(); drawMain(); toast('บันทึกข้อมูลคอร์สแล้ว'); } catch (err) { fail(err); }
      return;
    }
    case 'del-course': {
      const cid = S.cur.id;
      if (prompt(`ลบคอร์สและบทเรียนทั้งหมด (สิทธิ์และความคืบหน้าของนักเรียนยังอยู่)\nพิมพ์รหัสคอร์ส "${cid}" เพื่อยืนยัน`) !== cid) return;
      try { await A.deleteCourse(cid); S.cur = null; await refreshAll(); $('main').innerHTML = '<div class="empty">ลบคอร์สแล้ว</div>'; toast('ลบคอร์สแล้ว'); } catch (err) { fail(err); }
      return;
    }
    case 'new-lesson': S.editLid = A.newLessonId(S.cur.id); return drawLessons();
    case 'close-lesson': S.editLid = null; return drawLessons();
    case 'preview-lesson': {
      const l = readLessonForm();
      $('lprev').innerHTML = `<div class="prev">${renderBody(l.body) || '<span class="sub">ไม่มีเนื้อหา</span>'}</div>`;
      return typeset($('lprev'));
    }
    case 'save-lesson': {
      const l = readLessonForm(), lid = d.lid;
      if (!l.title) return toast('ใส่ชื่อบทก่อน');
      const old = S.lessons.find(x => x.id === lid);
      l.order = old ? old.order : S.lessons.length + 1;
      try { await A.saveLesson(S.cur.id, lid, l); S.editLid = null; await afterLessonChange('บันทึกบทแล้ว'); } catch (err) { fail(err); }
      return;
    }
    case 'del-lesson': {
      const l = S.lessons.find(x => x.id === d.lid);
      if (!l || !confirm(`ลบบท "${l.title}"?`)) return;
      try {
        await A.deleteLesson(S.cur.id, l.id);
        const rest = S.lessons.filter(x => x.id !== l.id), batch = db.batch();
        rest.forEach((x, k) => batch.update(A.lessonRef(S.cur.id, x.id), { order: k + 1 }));
        await batch.commit();
        S.editLid = null; await afterLessonChange('ลบบทแล้ว');
      } catch (err) { fail(err); }
      return;
    }
    case 'grant': {
      const email = $('grantEmail').value.trim(); if (!email) return;
      el.disabled = true;
      try {
        const u = await A.findStudentByEmail(email);
        if (!u) { toast('ไม่พบนักเรียนอีเมลนี้ — ให้นักเรียนสมัคร/เข้าสู่ระบบเว็บคอร์สก่อน'); el.disabled = false; return; }
        await A.grant(u.id, S.cur.id);
        const r = S.requests.find(x => x.uid === u.id && x.courseId === S.cur.id);
        if (r) { await A.dropRequest(r.id); S.requests = S.requests.filter(x => x !== r); }
        S.students = null; toast('ให้สิทธิ์ ' + email + ' แล้ว'); drawSide(); drawMain();
      } catch (err) { fail(err); el.disabled = false; }
      return;
    }
    case 'csv': return downloadCsv();
  }
});
addEventListener('hashchange', routeFromHash);
})();
</script>
