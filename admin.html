<style>
body{font-size:15px;line-height:1.55}
.topbar{padding:0 22px}
/* ---------- ประตูเข้า ---------- */
.gate{max-width:440px;margin:12vh auto;padding:40px 34px;border-radius:24px;background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:14px}
.gate .ic{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface2)}
.gate h1{font:700 28px/1.32 var(--head)}
.gate p{color:var(--muted);font-size:16px}
.gate .email{font:500 15px var(--mono);background:var(--surface2);border-radius:12px;padding:10px 14px;word-break:break-all}
.gate .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;padding:12px;border-radius:980px;font:500 16px var(--body);cursor:pointer;width:100%}
.gbtn:hover{background:#e8e8ed}

/* ---------- โครงหน้า ---------- */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 52px)}
.side{padding:20px 12px;display:flex;flex-direction:column;gap:2px;background:rgba(29,29,31,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--line);position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.me{display:flex;align-items:center;gap:11px;padding:10px 12px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.me .avatar{width:38px;height:38px;font-size:16px}
.me b{display:block;font:600 15px/1.3 var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.side h4{font:600 12px var(--head);color:var(--muted);margin:16px 12px 6px;display:flex;align-items:center;justify-content:space-between}
.side h4 button{font:400 13px var(--body);color:var(--link);background:none;border:0;cursor:pointer}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:10px;border:0;background:none;text-decoration:none;font:400 15px var(--body);color:var(--text);cursor:pointer;text-align:left}
.nv:hover{background:rgba(255,255,255,.06)}
.nv.on{background:rgba(255,255,255,.1);font-weight:600}
.nv .i{width:22px;display:grid;place-items:center;color:var(--muted)}
.nv.on .i{color:var(--accent)}
.nv .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#636366}
.nv .dot.pub{background:var(--ok)}
.side .foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:2px}
.main{padding:36px 40px 80px;min-width:0;max-width:1120px}

/* ---------- หัวหน้า ---------- */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.ph h1{font:700 32px/1.32 var(--head)}
.ph .hand{display:block;font-size:15px;margin-bottom:2px}
.ph p{color:var(--muted);font-size:16px;margin-top:4px}
.ph .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{border-radius:var(--r);background:var(--surface);padding:18px 20px}
.stat small{display:block;font:500 13px var(--body);color:var(--muted)}
.stat b{display:block;font:700 34px/1.2 var(--head);margin-top:4px;background:var(--ap-grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{background:none;color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- ตาราง / รายการ ---------- */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 13px var(--body);color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td small{color:var(--muted)}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.req{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .avatar{background:var(--student);width:34px;height:34px;font-size:14px}
.req .bd{flex:1;min-width:0}
.req b{font:600 15px var(--head)}
.req .q{font-size:14px;color:var(--text2);background:var(--surface2);border-radius:10px;padding:7px 12px;margin-top:6px}
.req small{color:var(--muted);font-size:13px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}
.crow:last-child{border-bottom:0}
.crow:hover b{color:var(--link)}
.crow .bd{flex:1;min-width:0}
.crow b{display:block;font:600 15px var(--head)}
.crow small{color:var(--muted);font-size:13px}
.crow .bar{width:90px}
.crow .pc{font:600 13px var(--head);color:var(--text2);width:40px;text-align:right}

/* ---------- หน้าคอร์ส ---------- */
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap;padding:3px;background:var(--surface3);border-radius:10px;margin-bottom:22px;max-width:100%}
.tabs button{border:0;background:none;border-radius:8px;padding:6px 16px;font:500 14px var(--body);cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:#636366;box-shadow:none}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.form .full{grid-column:1/-1}
.field textarea{min-height:100px;resize:vertical;font-family:var(--mono);font-size:14px;line-height:1.6}
.field textarea.tall{min-height:280px}
.chk{display:inline-flex;align-items:center;gap:9px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.switchrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--surface2);cursor:pointer}
.switchrow input{accent-color:var(--accent)!important}
.switchrow .bd{flex:1}
.switchrow small{display:block;color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .grip{flex:none;display:grid;place-items:center;width:32px;height:44px;margin:-8px -4px;padding:0;border:0;border-radius:8px;background:none;color:var(--muted);cursor:grab;touch-action:none}
.lrow .grip:hover,.lrow .grip:focus-visible{background:var(--surface2);color:var(--text)}
.lrow.dragging{position:relative;z-index:5;background:var(--surface3);border-radius:12px;box-shadow:var(--shadow);border-bottom-color:transparent}
.lrow.dragging .grip{cursor:grabbing}
body.lesson-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.lrow .n{font:600 13px var(--head);color:var(--muted);width:26px;text-align:center}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font:600 15px var(--head)}
.lrow .t small{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lrow.on{background:var(--accent-soft);border-radius:10px}
.lrow .bar{width:110px}
.prev{border-radius:14px;background:var(--surface2);padding:16px 18px;margin-top:14px;font-size:15px;line-height:1.75;color:var(--text2)}
.prev h2{font:700 20px var(--head);margin:.8em 0 .3em;color:var(--text)}
.prev h3{font:600 17px var(--head);margin:.8em 0 .3em;color:var(--text)}
.prev ul,.prev ol{padding-left:1.3em;margin:0 0 .8em}
.prev blockquote{padding:10px 14px;background:var(--surface);border-radius:10px;margin:.8em 0}
.prev p{margin:0 0 .8em}
.prev .embed{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin:.8em 0;background:#fff}
.prev .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prev .embed-cap{font-size:12px;text-align:right;margin-top:-.4em}
.prev .lbtn{display:inline-block;padding:6px 14px;background:var(--accent);color:#fff;border-radius:980px;text-decoration:none}
.prev img{max-width:100%}
.paybox{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:18px;align-items:start}
.payqr{border-radius:14px;background:#fff;padding:10px;text-align:center;font-size:12.5px;color:var(--muted);box-shadow:0 0 0 1px var(--line)}
.payqr svg{width:100%;height:auto;display:block}
.payqr .qh{background:#113566;color:#fff;border-radius:8px;font:600 12px var(--head);padding:4px;margin-bottom:6px}
.paid{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:5px 12px}
.paid b{color:var(--text)}
.tbubbles{display:flex;flex-direction:column;gap:10px}
.tbubble{max-width:82%;align-self:flex-start;padding:10px 14px;border-radius:16px;background:var(--surface2)}
.tbubble.me{align-self:flex-end;background:var(--accent-soft)}
.tbubble small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.tbubble-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6;margin-top:2px}
.tbubble p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.6}
.slip-view img{display:block;max-width:min(100%,420px);max-height:70vh;border-radius:12px;margin-top:10px}
@media (max-width:640px){.paybox{grid-template-columns:1fr}.payqr{max-width:200px}}
.danger-zone h3{color:var(--bad)}
/* สมาชิก */
.mtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.mtools .tabs{margin:0}
.msearch{flex:1;min-width:220px;max-width:360px}
.mlist{padding:8px 12px}
.mhead,.mrow{display:grid;grid-template-columns:40px minmax(0,2.2fr) 130px 90px minmax(120px,1.2fr) 120px;gap:12px;align-items:center}
.mhead{padding:8px 8px;font:500 13px var(--body);color:var(--muted);border-bottom:1px solid var(--line)}
.mrow{padding:10px 8px;border-bottom:1px solid var(--line);text-decoration:none;border-radius:10px}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:rgba(255,255,255,.05)}
.mrow .avatar{width:36px;height:36px;font-size:14px}
.mrow .who{min-width:0}.mrow .who b{display:block;font:600 15px var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mrow .who small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .pg{display:flex;align-items:center;gap:8px}.mrow .pg .bar{flex:1}
.mrow .la{font-size:13px}
.crumbs{margin-bottom:14px}
.mhero{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.mhero h1{font:700 30px/1.3 var(--head)}
@media (max-width:860px){.mhead{display:none}.mrow{grid-template-columns:40px minmax(0,1fr) auto;row-gap:4px}.mrow .cs,.mrow .la{display:none}.mrow .pg{grid-column:2/-1}}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .side .clist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .side .clist .nv{flex:none;width:auto;max-width:240px;background:var(--surface)}
  .main{padding:24px 16px 60px}
  .form{grid-template-columns:1fr}
  .ph h1{font-size:26px}
}
@media (max-width:480px){.gate{margin:8vh 16px;padding:30px 20px}.stats{gap:10px}.stat{padding:14px 16px}.stat b{font-size:26px}}
</style>
</head>

<script>
(function () {
const { esc, renderBody, typeset } = KPC;
const A = KPC.admin;
const $ = id => document.getElementById(id);
const db = KPC.db;
const SUBJECTS = ['ฟิสิกส์', 'ดาราศาสตร์', 'เคมี', 'ชีววิทยา', 'วิทยาศาสตร์ทั่วไป'];
const LEVELS = ['ม.4', 'ม.5', 'ม.6', 'ม.ปลาย', 'ม.1', 'ม.2', 'ม.3', 'ม.ต้น', 'มหาวิทยาลัย', 'ทุกระดับ'];
const GOOGLE_SVG = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }
const fmtTime = ts => { try { const d = ts && ts.toDate ? ts.toDate() : null; return d ? d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'; } catch (e) { return '—'; } };
const ago = ts => { const s = ts && ts.seconds; if (!s) return 'เมื่อสักครู่'; const m = Math.round((Date.now() / 1000 - s) / 60); return m < 1 ? 'เมื่อสักครู่' : m < 60 ? m + ' นาทีที่แล้ว' : m < 1440 ? Math.round(m / 60) + ' ชม.ที่แล้ว' : Math.round(m / 1440) + ' วันที่แล้ว'; };
const slug = s => String(s || '').toLowerCase().trim().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
const initial = s => String(s || '?').trim().charAt(0).toUpperCase();
const fail = e => toast('❌ ' + (e.code === 'permission-denied' ? 'ไม่มีสิทธิ์ทำรายการนี้ (หรือรหัสคอร์สซ้ำกับคอร์สของครูท่านอื่น)' : (e.message || e)), true);
const isAdmin = () => KPC.role === 'admin';

/* ===================== สถานะ ===================== */
const S = { courses: [], requests: [], enroll: [], revoked: [], threads: [], support: [], progress: [], staff: [], studentDocs: [], mFilter: 'all', mQuery: '', cur: null, tab: 'info', lessons: [], editLid: null, students: null, cprog: null };
const courseOf = cid => S.courses.find(c => c.id === cid);
const staffName = email => email === KPC.ADMIN_EMAIL ? 'แอดมิน' : ((S.staff.find(s => s.id === email) || {}).name || email || '—');
const pctOf = (p, c) => { const o = (c && c.outline) || []; if (!o.length) return 0; return Math.round((p.done || []).filter(x => o.some(l => l.id === x)).length / o.length * 100); };
function courseStats(c) {
  const en = S.enroll.filter(e => e.courseId === c.id), pr = S.progress.filter(p => p.courseId === c.id && en.some(e => e.uid === p.uid));
  const avg = en.length ? Math.round(en.reduce((s, e) => s + pctOf(pr.find(p => p.uid === e.uid) || {}, c), 0) / en.length) : 0;
  return { n: en.length, avg, req: S.requests.filter(r => r.courseId === c.id).length };
}

/* ===================== ล็อกอิน / ประตู ===================== */
function gate(user) {
  const g = $('gate');
  if (!KPC.configured) { g.innerHTML = '<div class="ic">⚙️</div><h1>ตั้งค่าเว็บ</h1><p>ยังไม่ได้ใส่ค่า Firebase — เปิดไฟล์ <b>firebase-config.js</b> แล้ววาง firebaseConfig</p>'; return; }
  if (!user) {
    g.innerHTML = `<div class="ic">🧑‍🏫</div><h1>ห้องครู</h1><p>สำหรับครูและแอดมินของคอร์สออนไลน์ เข้าสู่ระบบด้วย <b>Google</b> ของอีเมลที่แอดมินเพิ่มเป็นครูไว้</p>
      <button class="gbtn" type="button" data-google>${GOOGLE_SVG} เข้าสู่ระบบด้วย Google</button><div class="err" id="gErr"></div>
      <p class="sub">เป็นนักเรียน? <a href="index.html">ไปหน้าเรียน →</a></p>`;
    return;
  }
  const unverified = !user.emailVerified;
  g.innerHTML = `<div class="ic">🔒</div><h1>บัญชีนี้ยังไม่มีสิทธิ์ครู</h1>
    <div class="email">${esc(user.email || '')}</div>

// ย้ายข้อมูลระบบเดิม (ครั้งแรกที่แอดมินเปิด) — ทำซ้ำได้ ไม่มีอะไรให้ย้ายก็ไม่เขียน
async function autoMigrate(force) {
  const key = 'kpc-migrated-v2:' + KPC.db.app.options.projectId;
  let done = false; try { done = localStorage.getItem(key) === '1'; } catch (e) { /* ข้าม */ }
  if (done && !force) return;
  try { const n = await A.migrate(); try { localStorage.setItem(key, '1'); } catch (e) { /* ข้าม */ } if (n || force) toast(n ? `ปรับข้อมูลเข้าระบบ 4 บทบาทแล้ว (${n} รายการ)` : 'ข้อมูลเรียบร้อยดี ไม่มีอะไรต้องแก้'); }
  catch (e) { console.warn('migrate', e); if (force) fail(e); }
}

async function refreshAll() {
  const me = KPC.email();
  const jobs = [
    KPC.listCourses().then(l => { S.courses = isAdmin() ? l : l.filter(c => c.owner === me); }).catch(e => { S.courses = []; fail(e); }),
    A.requests().then(l => { S.requests = l; }).catch(() => { S.requests = []; }),
    A.enrollments().then(l => { S.enroll = l; }).catch(() => { S.enroll = []; }),
    A.progress().then(l => { S.progress = l; }).catch(() => { S.progress = []; }),
    A.revoked().then(l => { S.revoked = l; }).catch(() => { S.revoked = []; }),
    A.threads().then(l => { S.threads = l; }).catch(() => { S.threads = []; }),
  ];
  if (isAdmin()) jobs.push(A.supportThreads().then(l => { S.support = l; }).catch(() => { S.support = []; }), A.staffList().then(l => { S.staff = l; }).catch(() => { S.staff = []; }), A.students().then(l => { S.studentDocs = l; }).catch(() => { S.studentDocs = []; }));
  await Promise.all(jobs);
  if (S.cur) S.cur = courseOf(S.cur.id) || null;
  drawSide();
}

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = /^[/]c[/]([^/]+)(?:[/](\w+))?/.exec(h);
  S.editLid = null;
  if (m && courseOf(m[1])) { openCourse(m[1], m[2]); return; }
  S.cur = null;
  if (h === '/requests') drawRequests();
  else if (h === '/messages') drawThreads();
  else if (h.startsWith('/messages/s/') && isAdmin()) drawThread(h.slice(12), true);
  else if (h.startsWith('/messages/')) drawThread(h.slice(10));
  else if (h === '/teachers' && isAdmin()) { S.mFilter = 'teacher'; drawMembers(); }
  else if (h === '/members') drawMembers();
  else if (h.startsWith('/members/')) drawMember(h.slice(9));
  else if (h === '/new') drawNewCourse();
  else drawDash();
  drawSide();
  KPC.pageIn($('main'));
  KPC.motion($('main'), '.stat, .grid2 > .card, .stack > .card');
  window.scrollTo(0, 0);
}

/* ===================== สมาชิก =====================
   แอดมิน: นักเรียนทุกคน (students) + ครู (staff) + แอดมิน · ครู: นักเรียนในคอร์สของตัวเอง (จาก enrollments)
   key = uid ถ้ามี · ครูที่ยังไม่เคยเข้าเว็บ = 'e:' + อีเมล */
const lc = s => String(s || '').trim().toLowerCase();
function buildMembers() {
  const map = new Map(), byEmail = new Map();
  const add = (uid, email, name, extra) => {
    const k = uid || 'e:' + lc(email);
    let m = map.get(k);
    if (!m) { m = { key: k, uid: uid || '', email: email || '', name: name || '', en: [], rv: [], pr: [], createdAt: null }; map.set(k, m); if (email) byEmail.set(lc(email), m); }
    if (!m.name && name) m.name = name; if (!m.email && email) { m.email = email; byEmail.set(lc(email), m); }
    return Object.assign(m, extra || {});
  };
  if (isAdmin()) S.studentDocs.forEach(st => add(st.id, st.email, st.name, { createdAt: st.createdAt || null }));
  S.enroll.forEach(e => add(e.uid, e.email, e.name).en.push(e));
  S.revoked.forEach(r => add(r.uid, r.email, r.name).rv.push(r));
  S.progress.forEach(p => { const m = map.get(p.uid); if (m) m.pr.push(p); });
  if (isAdmin()) S.staff.forEach(st => { const m = byEmail.get(lc(st.id)) || add('', st.id, st.name); m.staff = st; if (st.name) m.staffName = st.name; });
  const list = [...map.values()];
  list.forEach(m => {
    m.role = lc(m.email) === KPC.ADMIN_EMAIL ? 'admin' : m.staff ? 'teacher' : 'student';
    m.display = m.staffName || m.name || (m.email || '').split('@')[0] || '(ไม่มีชื่อ)';
    const pcts = m.en.map(e => { const c = courseOf(e.courseId); return c ? pctOf(m.pr.find(p => p.courseId === e.courseId) || {}, c) : null; }).filter(x => x != null);
    m.avg = pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null;
    m.lastAt = m.pr.reduce((t, p) => Math.max(t, ((p.lastAt || p.updatedAt || {}).seconds) || 0), 0);
  });
  return list.sort((a, b) => (b.lastAt - a.lastAt) || a.display.localeCompare(b.display, 'th'));
}
const ROLE_PILL = { admin: '<span class="pill role" style="--role:var(--admin)">แอดมิน</span>', teacher: '<span class="pill role" style="--role:var(--teacher)">ครู</span>', student: '<span class="pill">นักเรียน</span>' };
const agoS = s => s ? ago({ seconds: s }) : '—';
function memberRows(list) {
  if (!list.length) return '<div class="empty">ไม่พบสมาชิก</div>';
  return list.map(m => `<a class="mrow" href="#/members/${encodeURIComponent(m.key)}">
    <span class="avatar" style="background:${m.role === 'admin' ? 'var(--admin)' : m.role === 'teacher' ? 'var(--teacher)' : 'var(--student)'}">${esc(initial(m.display))}</span>
    <span class="who"><b>${esc(m.display)}</b><small>${esc(m.email || '—')}</small></span>
    <span class="rl">${ROLE_PILL[m.role]}${m.staff && !m.staff.active ? ' <span class="pill">พักสิทธิ์</span>' : ''}</span>
    <span class="cs">${m.en.length ? m.en.length + ' คอร์ส' : m.rv.length ? '<span class="pill bad">ถอนสิทธิ์แล้ว</span>' : '<span class="sub">—</span>'}</span>
    <span class="pg">${m.avg == null ? '<span class="sub">—</span>' : `<span class="bar"><i style="width:${m.avg}%"></i></span><span class="mono">${m.avg}%</span>`}</span>
    <span class="la sub">${agoS(m.lastAt)}</span></a>`).join('');
}
function filteredMembers() {
  const q = lc(S.mQuery);
  return buildMembers().filter(m => (S.mFilter === 'all' || m.role === S.mFilter || (S.mFilter === 'teacher' && m.role === 'admin'))
    && (!q || lc(m.display).includes(q) || lc(m.email).includes(q) || lc(m.name).includes(q)));
}
function drawMembers() {
  document.title = (isAdmin() ? 'สมาชิก' : 'นักเรียนของฉัน') + ' · ห้องครู';
  const all = buildMembers(), n = r => all.filter(m => m.role === r).length;

function membersCsv() {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [['name', 'email', 'role', 'courses', 'avg_percent', 'last_active'].map(q).join(',')];
  filteredMembers().forEach(m => lines.push([m.display, m.email, m.role, m.en.map(e => (courseOf(e.courseId) || {}).title || e.courseId).join(' | '), m.avg == null ? '' : m.avg, m.lastAt ? new Date(m.lastAt * 1000).toISOString() : ''].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }));
  a.download = 'members.csv'; a.click();
}

/* ===================== หน้าคอร์ส ===================== */
async function openCourse(cid, tab) {
  const changed = !S.cur || S.cur.id !== cid;
  S.cur = courseOf(cid);
  S.tab = ['info', 'lessons', 'students', 'news', 'invites', 'progress'].includes(tab) ? tab : (changed ? 'lessons' : S.tab);
  if (changed) { S.students = null; S.cprog = null; S.invites = null; S.news = null; }
  drawSide();
  if (changed || !S.lessons) {
    $('main').innerHTML = '<div class="skel" style="width:40%;height:28px"></div><div class="skel"></div>';
    let L = null;   // โหลดไม่ได้ต้องไม่ถือว่าว่าง ไม่งั้นบันทึกครั้งต่อไปจะล้างสารบัญ
    try { L = await KPC.listLessons(cid); } catch (e) { fail(e); }
    if (!S.cur || S.cur.id !== cid) return;   // ระหว่างรอ ครูกดไปคอร์สอื่นแล้ว
    S.lessons = L;
  }
  drawMain();
}
function drawMain() {
  const c = S.cur; if (!c) return;
  document.title = c.title + ' · ห้องครู';
  const st = courseStats(c);
  const T = [['lessons', '', `บทเรียน <span class="sub">${(S.lessons || []).length}</span>`], ['students', '', `นักเรียน${st.req ? ` <span class="count">${st.req}</span>` : ` <span class="sub">${st.n}</span>`}`], ['news', '', 'ประกาศ'], ['invites', '', 'โค้ดเชิญ'], ['progress', '', 'ความคืบหน้า'], ['info', '', 'ข้อมูลคอร์ส']];
  $('main').innerHTML = `
    <div class="ph"><div>
      <div class="row" style="gap:6px;margin-bottom:6px">${c.published ? '<span class="pill ok">● เผยแพร่แล้ว</span>' : '<span class="pill warn">○ ร่าง — นักเรียนยังไม่เห็น</span>'}${isAdmin() ? `<span class="pill">ผู้สอน: ${esc(staffName(c.owner))}</span>` : ''}</div>
      <h1>${esc(c.title || c.id)}</h1><p class="mono" style="font-size:13px">${esc(c.id)}</p></div><span class="sp"></span>
      <a class="btn sm" href="index.html#/c/${encodeURIComponent(c.id)}" target="_blank" rel="noopener">ดูแบบนักเรียน ↗</a></div>
    <div class="tabs" role="tablist">${T.map(t => `<button type="button" role="tab" data-tab="${t[0]}" class="${S.tab === t[0] ? 'on' : ''}">${t[2]}</button>`).join('')}</div>
    <div id="pane"></div>`;
  history.replaceState(null, '', '#/c/' + encodeURIComponent(c.id) + '/' + S.tab);
  ({ info: drawInfo, lessons: drawLessons, students: drawStudents, news: drawNews, invites: drawInvites, progress: drawProgress })[S.tab]();
}

function readCourseForm() {
  const f = $('cform'), v = n => f.querySelector(`[name="${n}"]`);
  const o = { id: slug(v('id').value), title: v('title').value.trim(), subject: v('subject').value, level: v('level').value, author: v('author').value.trim(),
    order: Number(v('order').value) || 0, summary: v('summary').value.trim(), cover: v('cover').value.trim(), body: v('body').value, published: v('published').checked,
    price: Math.max(0, Math.round(Number(v('price').value) || 0)) };
  o.openEnroll = !o.price && v('openEnroll').checked;
  if (v('owner')) o.owner = v('owner').value;
  return o;
}
function readPay() {
  const f = $('cform'), v = n => f.querySelector(`[name="${n}"]`).value.trim();
  return { promptpay: v('promptpay').replace(/[^\d]/g, ''), name: v('payName'), note: v('payNote') };
}
function payPreview() {
  const f = $('cform'); if (!f) return;
  const price = Number(f.querySelector('[name=price]').value) || 0, p = readPay(), box = $('payPreview');
  $('payFields').hidden = !(price > 0);
  $('openRow').hidden = price > 0;
  const payload = KPC.promptpay(p.promptpay, price);
  if (!payload || !window.qrcode) { box.innerHTML = `<div class="qh">ตัวอย่าง QR</div><span>${p.promptpay ? 'เลขพร้อมเพย์ไม่ถูกรูปแบบ' : 'ใส่เลขพร้อมเพย์'}</span>`; return; }
  const qr = qrcode(0, 'M'); qr.addData(payload); qr.make();
  box.innerHTML = `<div class="qh">ตัวอย่าง QR</div>${qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true })}<b style="color:var(--text)">${KPC.baht(price)}</b>${p.name ? '<br>' + esc(p.name) : ''}<br><span>ลองสแกนด้วยแอปธนาคารได้ (ยังไม่ต้องโอน)</span>`;
}
// ตรวจก่อนบันทึก: คอร์สมีราคาต้องมีพร้อมเพย์ที่ถูกรูปแบบ

/* ---------- ลากจัดลำดับบท: เมาส์ + นิ้ว (Pointer Events) · แป้นพิมพ์ = ลูกศรขึ้นลงบนขีด ----------
   แถวย้ายบนจอทันที บันทึกตามหลังเป็นคิว ครูลากต่อเนื่องได้โดยไม่ต้องรอ */
let orderBusy = false, orderNext = null, orderFailed = null, orderMsgT = 0;
function orderStatus(html) { S.orderSt = html; if ($('orderSt')) $('orderSt').innerHTML = html; }
async function saveOrder(job) {
  orderNext = job; clearTimeout(orderMsgT);
  if (orderBusy) return;
  orderBusy = true; orderFailed = null;
  orderStatus('กำลังบันทึกลำดับ…');
  while (orderNext) {
    const j = orderNext; orderNext = null;
    try { await A.saveLessons(j.cid, j.lessons); noteOutline(j.cid, j.lessons); orderFailed = null; }
    catch (e) { orderFailed = j; fail(e); }
  }
  orderBusy = false;
  if (orderFailed) return orderStatus('<span style="color:var(--warn)">ยังบันทึกลำดับไม่สำเร็จ</span> <button class="btn xs" type="button" data-act="retry-order">ลองใหม่</button>');
  orderStatus('บันทึกลำดับแล้ว');
  orderMsgT = setTimeout(() => orderStatus(''), 2500);
}
addEventListener('beforeunload', e => { if (orderBusy || orderFailed) e.preventDefault(); });
function rowsChanged() {
  const rows = [...$('lessonRows').children], ids = rows.map(r => r.dataset.lid);
  rows.forEach((r, k) => { r.querySelector('.n').textContent = k + 1; });
  if (ids.every((id, k) => S.lessons[k].id === id)) return;
  S.lessons = ids.map(id => S.lessons.find(l => l.id === id));
  saveOrder({ cid: S.cur.id, lessons: S.lessons.slice() });
}
let drag = null;
function dragFrame() {
  if (!drag) return;
  if (drag.y < 90) scrollBy(0, -Math.min(14, (90 - drag.y) / 5));
  else if (drag.y > innerHeight - 70) scrollBy(0, Math.min(14, (drag.y - innerHeight + 70) / 5));
  dragPlace();
  drag.raf = requestAnimationFrame(dragFrame);
}
function dragPlace() {
  const { row, box, grabY, h } = drag;
  // ใช้ offsetTop (ไม่รวม transform) จึงไม่เพี้ยนระหว่างแถวอื่นกำลังเลื่อนหลบ
  const origin = row.getBoundingClientRect().top - drag.shift - row.offsetTop;
  const first = box.firstElementChild, last = box.lastElementChild;
  const top = Math.max(first.offsetTop - 6, Math.min(last.offsetTop + last.offsetHeight - h + 6, drag.y - grabY - origin));
  const mid = top + h / 2, slide = (el, d) => { if (!REDUCED_MOTION()) el.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 140, easing: 'ease-out' }); };
  let next;
  while ((next = row.nextElementSibling) && mid > next.offsetTop + next.offsetHeight / 2) { row.before(next); slide(next, h); }
  let prev;
  while ((prev = row.previousElementSibling) && mid < prev.offsetTop + prev.offsetHeight / 2) { row.after(prev); slide(prev, -h); }
  drag.shift = top - row.offsetTop;
  row.style.transform = `translateY(${drag.shift}px)`;
}
const REDUCED_MOTION = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function endDrag(cancel) {
  if (!drag) return;
  const { row, box, order } = drag; cancelAnimationFrame(drag.raf);
  if (cancel) order.forEach(r => box.append(r));
  if (!REDUCED_MOTION() && !cancel) row.animate([{ transform: `translateY(${drag.shift}px)` }, { transform: 'none' }], { duration: 120, easing: 'ease-out' });
  row.style.transform = ''; row.classList.remove('dragging'); document.body.classList.remove('lesson-dragging');
  drag = null;
  if (!cancel) rowsChanged();
}
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]'); if (!g || e.button) return;
  e.preventDefault();
  const row = g.closest('.lrow'), box = row.parentNode;
  g.setPointerCapture(e.pointerId);
  drag = { row, box, id: e.pointerId, y: e.clientY, grabY: e.clientY - row.getBoundingClientRect().top, h: row.offsetHeight, shift: 0, order: [...box.children] };
  row.classList.add('dragging'); document.body.classList.add('lesson-dragging');
  drag.raf = requestAnimationFrame(dragFrame);
});
document.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id) drag.y = e.clientY; });
document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) { drag.y = e.clientY; dragPlace(); endDrag(false); } });
document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(true); });
document.addEventListener('keydown', e => {
  if (drag && e.key === 'Escape') return endDrag(true);
  const g = e.target.closest && e.target.closest('[data-grip]'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const row = g.closest('.lrow'), to = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling; if (!to) return;
  if (e.key === 'ArrowUp') to.before(row); else to.after(row);
  g.focus();
  rowsChanged();
});

function downloadCsv() {
  const outline = S.cur.outline || [], q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [['name', 'email', 'done', 'total', 'percent', 'last_lesson', 'last_at'].concat(outline.map((l, i) => 'L' + (i + 1) + ' ' + l.title)).map(q).join(',')];
  (S._rows || []).forEach(r => lines.push([r.name || '', r.email, r.n, outline.length, r.pct, r.lastTitle, r.lastAt && r.lastAt.toDate ? r.lastAt.toDate().toISOString() : ''].concat(outline.map(l => r.done.includes(l.id) ? 1 : 0)).map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }));
  a.download = 'progress-' + S.cur.id + '.csv'; a.click();
}

/* ---------- นำเข้า (courses.js ของต้นแบบ หรือ JSON) ---------- */
$('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let list;
  try {
    // ตัดบรรทัดคอมเมนต์ // ออกก่อน (คอมเมนต์หัวไฟล์ courses.js มี [ … ] อยู่)
    const txt = (await file.text()).replace(/^﻿/, '').split('\n').filter(l => !/^\s*\/\//.test(l)).join('\n');
    const json = txt.slice(txt.indexOf('['), txt.lastIndexOf(']') + 1);
    list = JSON.parse(/^\s*[\[{]/.test(txt) ? txt : json);
    if (!Array.isArray(list)) list = [list];
  } catch (err) { toast('อ่านไฟล์ไม่ได้ — ต้องเป็น JSON หรือ window.COURSES = [...]', true); return; }
  for (const c of list) {
    const cid = slug(c.id || c.title);
    if (!cid) continue;
    const old = courseOf(cid);
    if (old && !confirm(`มีคอร์ส "${cid}" อยู่แล้ว — เขียนทับข้อมูลและบทเรียนทั้งหมด?`)) continue;
    try {
      if (old) await A.deleteCourse(cid);
      await A.saveCourse(cid, { title: c.title || cid, subject: c.subject || 'ฟิสิกส์', level: c.level || '', author: c.author || KPC.displayName(), summary: c.summary || '', body: c.body || '',
        cover: c.cover || '', order: Number(c.order) || 0, published: false, owner: (old && old.owner) || KPC.email(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      const batch = db.batch();
      (c.lessons || []).forEach((l, i) => {
        const lid = A.newLessonId(cid);
        batch.set(A.lessonRef(cid, lid), { order: i + 1, unit: l.unit || '', title: l.title || '', video: l.video || '', dur: l.dur || '',
          body: l.body || '', file: l.file || '', quiz: l.quiz || '', free: l.free === true || l.free === 'TRUE' });
      });
      await batch.commit();
      await A.syncOutline(cid);
      toast(`นำเข้า "${c.title}" แล้ว (${(c.lessons || []).length} บท · ยังเป็นร่าง)`);
    } catch (err) { fail(err); return; }
  }
  await refreshAll();
  if (list[0]) location.hash = '#/c/' + encodeURIComponent(slug(list[0].id || list[0].title)) + '/lessons';
});

async function reloadCourseData() { S.students = null; S.cprog = null; S.invites = null; S.news = null; await refreshAll(); }
document.addEventListener('click', async e => {
  const el = e.target.closest('button'); if (!el) return;
  const d = el.dataset;
  if (d.google !== undefined) { try { await KPC.loginGoogle(); } catch (err) { const g = $('gErr'); if (g) g.textContent = err.code === 'auth/popup-closed-by-user' ? '' : KPC.authError(err.code); } return; }
  if (d.logout !== undefined) { KPC.logout(); return; }
  if (d.recheck !== undefined) { await KPC.refreshMe(); location.reload(); return; }
  if (d.copy !== undefined) { try { await navigator.clipboard.writeText(KPC.user().email); toast('คัดลอกอีเมลแล้ว'); } catch (err) { toast(KPC.user().email); } return; }
  if (d.tab) { S.tab = d.tab; S.editLid = null; return drawMain(); }
  if (d.edit) { S.editLid = d.edit; return drawLessons(); }
  if (d.slip) {
    const box = document.querySelector(`[data-slipv="${CSS.escape(d.slip)}"]`); if (!box) return;
    if (box.firstChild) { box.innerHTML = ''; el.textContent = 'ดูสลิป'; return; }
    el.disabled = true;
    const s = await A.slip(d.slip);
    el.disabled = false;
    if (!s) { box.innerHTML = '<small>ไม่มีสลิปแนบมา</small>'; return; }
    box.innerHTML = `<img src="${esc(s.image)}" alt="สลิปการโอน">`;
    el.textContent = 'ซ่อนสลิป';
    return;
  }
  if (d.approve || d.reject) {
    const r = S.requests.find(x => x.id === (d.approve || d.reject)); if (!r) return;
    const c = courseOf(r.courseId);
    // ไม่อนุมัติลบคำขอ + สลิปแบบกู้คืนไม่ได้ จึงต้องยืนยันก่อน · กดยกเลิก = ไม่ทำอะไร
    const reason = d.reject ? prompt(`ไม่อนุมัติคำขอของ ${r.name || r.email}?\nคำขอและสลิปจะถูกลบ กู้คืนไม่ได้\n\nพิมพ์เหตุผลให้นักเรียนเห็น เช่น ยอดไม่ตรง หรือสลิปไม่ชัด`, '') : '';
    if (reason === null) return;
    el.disabled = true;
    try {
      if (d.approve) { if (!c) throw new Error('ไม่พบคอร์สของคำขอนี้'); await A.grant({ uid: r.uid, email: r.email, name: r.name, contact: r.contact }, c); }
      // อนุมัติแล้วเก็บสลิปไว้เป็นหลักฐาน
      if (d.reject) { await A.rejectRequest(r, reason.trim()); mail('rejected', r.id); }
      else { await A.dropRequest(r.id); A.dropRejection(r.id); mail('approved', r.id); }
      toast(d.approve ? `✓ อนุมัติ ${r.name || r.email} แล้ว` : `ปฏิเสธคำขอของ ${r.name || r.email}`);
      await reloadCourseData();
    } catch (err) { fail(err); el.disabled = false; return; }
    return S.cur ? drawMain() : route();
  }
  if (d.revoke) {
    const u = (S.students || []).find(x => x.uid === d.revoke);
    if (!u) return;
    const reason = prompt(`ถอนสิทธิ์ ${u.name || u.email} ออกจากคอร์สนี้?\nความคืบหน้าและสลิปยังเก็บไว้\n\nพิมพ์เหตุผลให้นักเรียนเห็น เช่น หมดเวลาเรียน หรือยอดโอนไม่เข้า`, '');
    if (reason === null) return;
    try { await A.revoke(u, S.cur, reason.trim()); mail('revoked', u.uid + '_' + S.cur.id); toast('ถอนสิทธิ์แล้ว'); await reloadCourseData(); } catch (err) { fail(err); }
    return drawMain();
  }
  if (d.mfilter) { S.mFilter = d.mfilter; return drawMembers(); }
  if (d.reply || d.sreply) {
    const box = $('replyText'), text = box.value.trim(), id = d.reply || d.sreply;
    if (!text) { toast('พิมพ์คำตอบก่อน', true); box.focus(); return; }
    el.disabled = true;
    try {
      if (d.sreply) { await A.replySupport(id, text); mail('support-reply', id); }
      else {
        const fresh = S.newThread && S.newThread.id === id ? S.newThread : null, t = S.threads.find(x => x.id === id) || fresh;
        await A.reply(id, text, t && t.owner, fresh); S.newThread = null; mail('reply', id);
      }
      toast('ส่งข้อความแล้ว'); await refreshAll(); await drawThread(id, !!d.sreply);
    } catch (err) { fail(err); el.disabled = false; }
    return;
  }
  if (d.newsdel) {
    if (!confirm('ลบประกาศนี้? นักเรียนจะไม่เห็นอีก')) return;
    el.disabled = true;
    try { await A.dropNews(S.cur.id, d.newsdel); S.news = null; toast('ลบประกาศแล้ว'); } catch (err) { fail(err); el.disabled = false; return; }
    return drawNews();
  }
  if (d.msg) {
    // ยังไม่เคยคุย: เปิดห้องเปล่า สร้างจริงเมื่อกดส่งข้อความแรก
    const [uid, cid] = d.msg.split('|'), tid = uid + '_' + cid, c = courseOf(cid);
    const en = S.enroll.find(x => x.uid === uid && x.courseId === cid) || (S.students || []).find(x => x.uid === uid);
    if (!c || !en) return;
    S.newThread = S.threads.some(t => t.id === tid) ? null : { id: tid, uid, email: en.email || '', name: en.name || '', courseId: cid, owner: c.owner || '', isNew: true };
    location.hash = '#/messages/' + tid;
    return;
  }
  if (d.invcopy) {
    const x = (S.invites || []).find(y => y.id === d.invcopy); if (!x) return;
    try { await navigator.clipboard.writeText(inviteMessage(S.cur, x)); toast('คัดลอกข้อความพร้อมส่งแล้ว'); } catch (err) { toast('คัดลอกไม่ได้ เบราว์เซอร์ไม่อนุญาต', true); }
    return;
  }
  if (d.invdel) {
    if (!confirm(`ลบโค้ด ${fmtCode(d.invdel)}?\nนักเรียนที่ได้โค้ดนี้ไปจะใช้ไม่ได้`)) return;
    el.disabled = true;
    try { await A.dropInvite(d.invdel); S.invites = null; toast('ลบโค้ดแล้ว'); } catch (err) { fail(err); el.disabled = false; return; }
    return drawInvites();
  }
  if (d.regrant || d.rmname) {
    const r = S.revoked.find(x => x.id === (d.regrant || d.rmname)); if (!r) return;
    const c = courseOf(r.courseId);
    if (d.rmname && !confirm(`นำชื่อ ${r.name || r.email} ออกจากคอร์ส “${(c || {}).title || r.courseId}”?\nเหตุผล สลิป และความคืบหน้าของคอร์สนี้จะถูกลบด้วย กู้คืนไม่ได้`)) return;
    if (d.regrant && !c) return;
    el.disabled = true;
    try {
      if (d.regrant) { await A.grant({ uid: r.uid, email: r.email, name: r.name, contact: r.contact }, c); mail('approved', r.id); }
      else await A.removeFromCourse(r.id);
      toast(d.regrant ? 'ให้สิทธิ์อีกครั้งแล้ว' : 'นำชื่อออกแล้ว');
      await reloadCourseData();
    } catch (err) { fail(err); el.disabled = false; return; }
    return S.cur && location.hash.startsWith('#/c/') ? drawMain() : route();
  }
  if (d.mrevoke) {
    const [uid, cid] = d.mrevoke.split('|'), c = courseOf(cid);
    if (!c) return;
    const reason = prompt(`ถอนสิทธิ์คอร์ส “${c.title}”?\nความคืบหน้าและสลิปยังเก็บไว้\n\nพิมพ์เหตุผลให้นักเรียนเห็น เช่น หมดเวลาเรียน หรือยอดโอนไม่เข้า`, '');
    if (reason === null) return;
    const en = S.enroll.find(x => x.uid === uid && x.courseId === cid) || { uid };
    try { await A.revoke(en, c, reason.trim()); mail('revoked', uid + '_' + cid); toast('ถอนสิทธิ์แล้ว'); await reloadCourseData(); route(); } catch (err) { fail(err); }
    return;
  }
  if (d.mgrant) {
    const m = buildMembers().find(x => x.key === d.mgrant), c = courseOf($('mgCourse').value); if (!m || !c) return;
    el.disabled = true;
    try { const r = S.requests.find(x => x.uid === m.uid && x.courseId === c.id); await A.grant({ uid: m.uid, email: m.email, name: m.name || m.display, contact: r && r.contact }, c); mail('approved', m.uid + '_' + c.id); if (r) await A.dropRequest(r.id); toast('ให้สิทธิ์ “' + c.title + '” แล้ว'); await refreshAll(); route(); } catch (err) { fail(err); el.disabled = false; }
    return;
  }
  if (d.toggleStaff) {
    const s = S.staff.find(x => x.id === d.toggleStaff); if (!s) return;
    try { await A.saveStaff(s.id, { active: !s.active }); toast(s.active ? 'พักสิทธิ์ครูแล้ว' : 'เปิดสิทธิ์ครูแล้ว'); await refreshAll(); route(); } catch (err) { fail(err); }
    return;
  }
  if (d.delStaff) {
    const s = S.staff.find(x => x.id === d.delStaff); if (!s) return;
    const n = S.courses.filter(c => c.owner === s.id).length;
    if (!confirm(`ลบ ${s.name || s.id} ออกจากรายชื่อครู?` + (n ? `\nครูคนนี้มี ${n} คอร์ส — คอร์สยังอยู่ แต่จะไม่มีครูดูแล จนกว่าแอดมินจะโอนให้คนอื่น` : ''))) return;
    try { await A.deleteStaff(s.id); toast('ถอดออกจากครูแล้ว'); await refreshAll(); route(); } catch (err) { fail(err); }
    return;
  }
  switch (d.act) {
    case 'import': return $('importFile').click();
    case 'new-course': location.hash = '#/new'; return;
    case 'create-course': {
      const c = readCourseForm();
      if (!c.title) return toast('ใส่ชื่อคอร์สก่อน', true);
      if (!c.id) return toast('ใส่รหัสคอร์ส (a-z 0-9 -)', true);
      if (courseOf(c.id)) return toast('รหัสนี้มีแล้ว', true);
      const pay = readPay(), pe = payError(c, pay); if (pe) return toast(pe, true);
      el.disabled = true;
      try {
        if (await KPC.getCourse(c.id).catch(() => null)) { el.disabled = false; return toast('รหัสนี้มีคอร์สอื่นใช้แล้ว', true); }
        await A.saveCourse(c.id, Object.assign(c, { owner: KPC.email(), outline: [], lessonCount: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() }));
        if (c.price > 0 || pay.promptpay) await A.savePayInfo(c.id, pay);
        await refreshAll(); location.hash = '#/c/' + encodeURIComponent(c.id) + '/lessons'; toast('สร้างคอร์สแล้ว — เพิ่มบทเรียนต่อได้เลย');
      } catch (err) { fail(err); el.disabled = false; }
      return;
    }
    case 'save-course': {
      const c = readCourseForm(); delete c.id;
      const newOwner = c.owner; delete c.owner;
      const pay = readPay(), pe = payError(c, pay); if (pe) return toast(pe, true);
      el.disabled = true;
      try {
        await A.saveCourse(S.cur.id, c); Object.assign(S.cur, c);
        if (c.price > 0 || pay.promptpay) await A.savePayInfo(S.cur.id, pay);
        if (newOwner && newOwner !== S.cur.owner) { const n = await A.reassign(S.cur.id, newOwner); toast(`โอนคอร์สให้ ${staffName(newOwner)} แล้ว (ย้าย ${n} รายการ)`); await reloadCourseData(); }
        else toast('บันทึกข้อมูลคอร์สแล้ว');
        drawSide(); drawMain();
      } catch (err) { fail(err); el.disabled = false; }
      return;
    }
    case 'del-course': {
      const cid = S.cur.id;
      if (prompt(`ลบคอร์สและบทเรียนทั้งหมด (สิทธิ์และความคืบหน้าของนักเรียนยังอยู่)\nพิมพ์รหัสคอร์ส "${cid}" เพื่อยืนยัน`) !== cid) return;
      try { await A.deleteCourse(cid); S.cur = null; await refreshAll(); location.hash = '#/'; toast('ลบคอร์สแล้ว'); } catch (err) { fail(err); }
      return;
    }
    case 'new-lesson': S.editLid = A.newLessonId(S.cur.id); return drawLessons();
    case 'close-lesson': S.editLid = null; return drawLessons();
    case 'reload-lessons': return openCourse(S.cur.id, 'lessons');
    case 'retry-order': if (orderFailed) saveOrder(orderFailed); return;
    case 'preview-lesson': {
      const l = readLessonForm();
      const vsrc = KPC.videoSrc(l.video);
      $('lprev').innerHTML = `<div class="prev">${vsrc ? `<div class="embed v"><iframe src="${esc(vsrc)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen title="ตัวอย่างคลิป"></iframe></div>` : ''}${renderBody(l.body) || (vsrc ? '' : '<span class="sub">ไม่มีเนื้อหา</span>')}</div>`;
      return typeset($('lprev'));
    }
    case 'save-lesson': {
      const l = readLessonForm(), lid = d.lid;
      if (!l.title) return toast('ใส่หัวข้อก่อน', true);
      const old = S.lessons.find(x => x.id === lid), next = S.lessons.slice(), row = Object.assign({ id: lid, order: old ? old.order : next.length + 1 }, l);
      if (old) next[next.indexOf(old)] = row; else next.push(row);
      const label = el.textContent;
      el.disabled = true; el.textContent = 'กำลังบันทึก…';
      try { await commitLessons(S.cur.id, next, { set: lid }, KPC.videoIssue(l.video) ? 'บันทึกบทแล้ว แต่ลิงก์คลิปยังเล่นไม่ได้' : 'บันทึกบทแล้ว'); }
      catch (err) { fail(err); el.disabled = false; el.textContent = label; }
      return;
    }
    case 'del-lesson': {
      const l = S.lessons.find(x => x.id === d.lid);
      if (!l || !confirm(`ลบบท "${l.title}"?`)) return;
      try { await commitLessons(S.cur.id, S.lessons.filter(x => x.id !== l.id), { del: l.id }, 'ลบบทแล้ว'); }
      catch (err) { fail(err); }
      return;
    }
    case 'grant': {
      const email = $('grantEmail').value.trim(); if (!email) return;
      el.disabled = true;
      try {
        const u = await A.findStudentByEmail(email);
        if (!u) { toast('ไม่พบนักเรียนอีเมลนี้ — ให้นักเรียนสมัคร/เข้าสู่ระบบเว็บคอร์สก่อน', true); el.disabled = false; return; }
        const r = S.requests.find(x => x.uid === u.id && x.courseId === S.cur.id);
        await A.grant(Object.assign({}, u, { contact: r && r.contact }), S.cur);
        mail('approved', u.id + '_' + S.cur.id);
        if (r) await A.dropRequest(r.id);
        toast('ให้สิทธิ์ ' + email + ' แล้ว'); await reloadCourseData(); drawMain();
      } catch (err) { fail(err); el.disabled = false; }
      return;
    }
    case 'add-teacher': {
      const email = $('tEmail').value.trim().toLowerCase(), name = $('tName').value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('รูปแบบอีเมลไม่ถูกต้อง', true);
      if (email === KPC.ADMIN_EMAIL) return toast('อีเมลนี้เป็นแอดมินอยู่แล้ว', true);
      el.disabled = true;
      try { await A.saveStaff(email, { name: name || email.split('@')[0], active: true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); toast('เพิ่ม ' + (name || email) + ' เป็นครูแล้ว'); await refreshAll(); route(); } catch (err) { fail(err); el.disabled = false; }
      return;
    }
    case 'news-post': {
      const text = $('newsText').value.trim();
      if (!text) { toast('พิมพ์ประกาศก่อน', true); $('newsText').focus(); return; }
      if (!confirm(`ส่งประกาศถึงนักเรียนทุกคนในคอร์ส “${S.cur.title}”?`)) return;
      el.disabled = true;
      try { await A.postNews(S.cur.id, text); S.news = null; toast('ส่งประกาศแล้ว'); } catch (err) { fail(err); el.disabled = false; return; }
      return drawNews();
    }
    case 'invite-create': {
      const emails = [...new Set($('invEmails').value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean))];
      const bad = emails.find(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      if (bad) return toast('อีเมลไม่ถูกต้อง: ' + bad, true);
      const n = Math.floor(Number($('invCount').value));
      if (emails.length > 200) return toast('สร้างได้ครั้งละไม่เกิน 200 โค้ด', true);
      if (!emails.length && !(n >= 1 && n <= 200)) return toast('ใส่จำนวนโค้ด 1–200', true);
      el.disabled = true;
      try { const m = await A.createInvites(S.cur, emails, n); S.invites = null; toast(`สร้าง ${m} โค้ดแล้ว`); } catch (err) { fail(err); el.disabled = false; return; }
      return drawInvites();
    }
    case 'invite-copy-all': {
      const t = `คอร์ส: ${S.cur.title}\nเข้าเรียน: ${courseLink(S.cur)}\nโค้ดเชิญ (คนละ 1 โค้ด):\n` + (S.invites || []).filter(x => !x.usedBy).map(x => fmtCode(x.id) + (x.email ? ' — ' + x.email : '')).join('\n');
      try { await navigator.clipboard.writeText(t); toast('คัดลอกแล้ว'); } catch (err) { toast('คัดลอกไม่ได้ เบราว์เซอร์ไม่อนุญาต', true); }
      return;
    }
    case 'backup': case 'backup-slips': {
      const label = el.textContent; el.disabled = true; el.textContent = 'กำลังเตรียมไฟล์…';
      try {
        const data = await A.backup(d.act === 'backup-slips'), day = new Date().toISOString().slice(0, 10);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify({ project: KPC.db.app.options.projectId, exportedAt: new Date().toISOString(), docs: data }, null, 1)], { type: 'application/json' }));
        a.download = `kp-course-backup-${day}${d.act === 'backup-slips' ? '-slips' : ''}.json`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        try { localStorage.setItem('kpc-last-backup', day); } catch (err) { /* ข้าม */ }
        toast(`สำรองแล้ว ${Object.keys(data).length} รายการ`);
        el.textContent = label; el.disabled = false;
        const m = $('lastBackup'); if (m) m.textContent = 'สำรองล่าสุดจากเครื่องนี้: ' + day;
      } catch (err) { el.textContent = label; el.disabled = false; fail(err); }
      return;
    }
    case 'migrate': el.disabled = true; await autoMigrate(true); await refreshAll(); route(); return;
    case 'csv': return downloadCsv();
    case 'm-csv': return membersCsv();
    case 'm-rename': {
      const m = buildMembers().find(x => x.key === d.key), name = $('mRename').value.trim(); if (!m || !name) return;
      el.disabled = true;
      try { await A.setStudentName(m.uid, name); toast('บันทึกชื่อแล้ว'); await refreshAll(); route(); } catch (err) { fail(err); el.disabled = false; }
      return;
    }
    case 'm-make-teacher': {
      const m = buildMembers().find(x => x.key === d.key); if (!m || !m.email) return;
      if (!confirm(`ตั้ง ${m.display} (${m.email}) เป็นครู?\nครูสร้างและจัดการคอร์สของตัวเองได้`)) return;
      try { await A.saveStaff(m.email, { name: m.name || m.display, active: true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); toast('ตั้งเป็นครูแล้ว'); await refreshAll(); route(); } catch (err) { fail(err); }
      return;
    }
    case 'm-delete': {
      const m = buildMembers().find(x => x.key === d.key); if (!m || !m.uid) return;
      if (prompt(`ลบข้อมูลของ ${m.display} ทั้งหมด (ย้อนกลับไม่ได้)\nพิมพ์อีเมล "${m.email}" เพื่อยืนยัน`) !== m.email) return;
      try { const n = await A.deleteMember(m.uid); toast(`ลบข้อมูลแล้ว (${n} รายการ)`); await refreshAll(); location.hash = '#/members'; } catch (err) { fail(err); }
      return;
    }
  }
});

/* ---------- เมนูผู้ใช้ ---------- */
$('whoBtn').addEventListener('click', e => { e.stopPropagation(); const o = $('who').classList.toggle('open'); $('whoBtn').setAttribute('aria-expanded', o); });
document.addEventListener('click', e => { if (!e.target.closest('#who')) $('who').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('who').classList.remove('open'); });
})();
</script>
</body>
</html>
