<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="course-ui.css?v=2">
<style>
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* ---------- หน้าแรก: ผู้เยี่ยมชม ---------- */
.hero{position:relative;padding:64px 0 56px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.hero::before{content:"";position:absolute;inset:-60px -20vw auto;height:520px;background:radial-gradient(50% 60% at 25% 30%,rgba(56,189,248,.16),transparent 70%),radial-gradient(40% 50% at 80% 20%,rgba(129,140,248,.14),transparent 70%);pointer-events:none;z-index:-1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);color:var(--accent);padding:4px 12px;border-radius:99px;font:700 12px var(--head);letter-spacing:.06em}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18)}
.hero h1{font:700 clamp(2rem,4.8vw,3.3rem)/1.22 var(--head);margin:16px 0 14px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:var(--text2);font-size:18px;max-width:560px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:14px}
.hero .trust span::before{content:"✓ ";color:var(--ok);font-weight:700}
/* ภาพตัวอย่างบทเรียน (วาดด้วย CSS) */
.mock{position:relative;border:1px solid var(--line2);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;transform:rotate(1.2deg)}
.mock-v{aspect-ratio:16/9;background:linear-gradient(135deg,#0ea5e9,#6366f1);position:relative;overflow:hidden}
.mock-v svg{position:absolute;inset:0;width:100%;height:100%}
.mock-v .play{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(6,9,15,.55);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:20px}
.mock-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.mock-b b{font:700 16px var(--head)}
.mock-row{display:flex;gap:8px;flex-wrap:wrap}
.mock-row span{font-size:12.5px;padding:3px 10px;border-radius:7px;background:var(--surface2);color:var(--text2)}
.mock-row span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mock-p{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.mock-p .bar{flex:1}
.float{position:absolute;right:-10px;bottom:22px;background:var(--surface3);border:1px solid var(--line2);border-radius:12px;padding:9px 13px;font:600 13px var(--head);box-shadow:var(--shadow);transform:rotate(-1.2deg)}
.float b{color:var(--ok)}

.sec{padding:44px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-h h2{font:700 clamp(1.4rem,2.6vw,1.9rem)/1.3 var(--head)}
.sec-h p{color:var(--muted)}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.feat{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px}
.feat .fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface3);margin-bottom:12px}
.feat h3{font:700 17px var(--head);margin-bottom:4px}
.feat p{color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:st}
.step{position:relative;border:1px solid var(--line);border-radius:14px;padding:22px 22px 22px 70px;background:var(--surface)}
.step::before{counter-increment:st;content:counter(st);position:absolute;left:20px;top:20px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--mono);background:rgba(56,189,248,.14);color:var(--accent)}
.step h3{font:700 16px var(--head)}
.step p{color:var(--muted);font-size:14.5px}
.band{border:1px solid var(--line2);border-radius:18px;padding:30px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:radial-gradient(60% 120% at 0% 0%,rgba(56,189,248,.14),transparent 60%),var(--surface)}
.band h3{font:700 22px var(--head)}
.band p{color:var(--muted)}
.band .sp{flex:1}

/* ---------- หน้าแรก: นักเรียน / ครู ---------- */
.dash-h{padding:36px 0 8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dash-h h1{font:700 clamp(1.6rem,3.4vw,2.3rem)/1.3 var(--head)}
.dash-h p{color:var(--muted)}
.dash-h .sp{flex:1}
.staffbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--role) 40%,transparent);background:color-mix(in srgb,var(--role) 8%,var(--surface));border-radius:12px;padding:12px 16px;margin-top:18px}
.staffbar .sp{flex:1}
.resume{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--surface);text-decoration:none;transition:border-color .3s,transform .3s var(--ease)}
.resume:hover{border-color:var(--accent);transform:translateY(-2px)}
.resume-cv{background:linear-gradient(135deg,var(--a,#0ea5e9),var(--b,#6366f1));display:grid;place-items:center;position:relative;min-height:150px}
.resume-cv .play{width:56px;height:56px;border-radius:50%;background:rgba(6,9,15,.55);display:grid;place-items:center;color:#fff;font-size:20px}
.resume-bd{padding:20px 24px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.resume-bd small{font:700 12px var(--head);letter-spacing:.08em;color:var(--accent)}
.resume-bd h3{font:700 21px/1.4 var(--head)}
.resume-bd .meta{color:var(--muted);font-size:14px}
.resume-bd .pr{display:flex;align-items:center;gap:12px;margin-top:4px}
.resume-bd .pr .bar{flex:1;max-width:340px}
.resume-bd .pr span{font:600 14px var(--mono);color:var(--text2)}
.pend{display:flex;flex-direction:column;gap:8px}
.pend-i{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface)}
.pend-i b{font:600 15px var(--head)}
.pend-i .sp{flex:1}

/* ---------- การ์ดคอร์ส ---------- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.cc{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;transition:transform .35s var(--ease),border-color .3s,box-shadow .3s}
.cc:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.45);box-shadow:var(--shadow)}
.cc-cv{position:relative;aspect-ratio:16/8;background:linear-gradient(135deg,var(--a,#0ea5e9),var(--b,#6366f1));display:flex;align-items:flex-end;padding:16px}
.cc-cv::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 90% at 85% 10%,rgba(255,255,255,.25),transparent 60%)}
.cc-cv em{position:relative;font:700 12px var(--head);letter-spacing:.16em;font-style:normal;color:#fff;opacity:.92}
.cc-cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc-st{position:absolute;right:12px;top:12px}
.cc-st .pill{background:rgba(6,9,15,.82)}
.cc-dr{position:absolute;left:12px;top:12px}
.cc-bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.cc-tags{display:flex;gap:6px;flex-wrap:wrap}
.cc h3{font:700 18px/1.45 var(--head)}
.cc p{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-meta{margin-top:auto;padding-top:10px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cc-meta .free{color:var(--ok);font-weight:600}
.cc-pr{display:flex;align-items:center;gap:10px;margin-top:8px;font:600 12.5px var(--mono);color:var(--text2)}
.cc-pr .bar{flex:1}

/* ---------- หน้าคอร์ส ---------- */
.view{padding:24px 0 40px}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--text)}
.c-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.c-head h1{font:700 clamp(1.5rem,3.2vw,2.2rem)/1.3 var(--head);margin:8px 0 4px}
.c-tags{display:flex;gap:6px;flex-wrap:wrap}
.c-sum{color:var(--muted);max-width:760px}
.c-by{font-size:13.5px;color:var(--muted)}
.course{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;margin-top:22px}
.player{position:relative;aspect-ratio:16/9;border:1px solid var(--line2);border-radius:14px;background:#000;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.player.ph{display:flex;align-items:flex-end;padding:22px;background:linear-gradient(135deg,var(--a,#0ea5e9),var(--b,#6366f1));color:#fff}
.player.ph b{font:700 24px/1.4 var(--head)}
.player.ph small{display:block;font:700 12px var(--head);letter-spacing:.12em;opacity:.85}
.lock{position:relative;border:1px solid var(--line2);border-radius:14px;background:radial-gradient(70% 90% at 80% 0%,rgba(129,140,248,.18),transparent 60%),var(--surface);padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:300px;justify-content:center}
.lock .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--surface3)}
.lock h3{font:700 21px var(--head)}
.lock p{color:var(--text2);max-width:480px;font-size:15px}
.lock textarea{width:min(440px,100%);min-height:76px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14.5px;resize:vertical;outline:none}
.lock textarea:focus{border-color:var(--accent)}
.lock .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ls-h{margin:20px 0 6px}
.ls-h small{font-size:13px;color:var(--muted)}
.ls-h h2{font:700 24px/1.4 var(--head);margin-top:2px}
.ls-meta{display:flex;flex-wrap:wrap;gap:6px}
.ltabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%}
.ltabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font:600 14px var(--head);cursor:pointer;color:var(--muted)}
.ltabs button:hover{color:var(--text)}
.ltabs button.on{background:var(--surface3);color:var(--text)}
.lpanel{padding-top:20px}
.lpanel[hidden]{display:none}
.res{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:12px 14px;margin-bottom:10px}
.res .ri{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--indigo));color:#06090f;font-size:18px}
.res b{display:block;font:600 15px var(--head)}
.res small{color:var(--muted);font-size:13px}
.res .sp{flex:1}
.ls-nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:28px}
.ls-nav .pn{display:flex;gap:10px}
.donebtn{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font:600 14.5px var(--head);cursor:pointer;transition:.2s}
.donebtn .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;color:transparent;transition:.2s}
.donebtn:hover{border-color:var(--ok)}
.donebtn.on{border-color:var(--ok);background:rgba(52,211,153,.1);color:var(--ok)}
.donebtn.on .bx{background:var(--ok);border-color:var(--ok);color:#04130d}
.freenote{color:var(--muted);font-size:14px}

/* สารบัญ */
.toc{position:sticky;top:76px;align-self:start;border:1px solid var(--line2);border-radius:14px;background:var(--surface);max-height:calc(100vh - 96px);overflow:auto}
.toc-h{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.toc-h b{font:700 15px var(--head);display:flex;justify-content:space-between;gap:10px}
.toc-h b small{font:600 13px var(--mono);color:var(--ok)}
.toc-h .bar{margin-top:8px}
.unit+.unit{border-top:1px solid var(--line)}
.unit summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;font:600 14px var(--head);background:var(--surface2)}
.unit summary::-webkit-details-marker{display:none}
.unit summary .un{font:700 11px var(--mono);background:var(--accent);color:#06090f;padding:1px 6px;border-radius:4px}
.unit summary .ut{flex:1}
.unit summary small{font-size:12px;color:var(--muted);font-weight:400}
.unit summary::after{content:"▾";color:var(--muted);transition:transform .25s}
.unit:not([open]) summary::after{transform:rotate(-90deg)}
.toc button{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 16px;cursor:pointer;font-size:14.5px;line-height:1.45;align-items:center}
.toc button:hover{background:var(--surface2)}
.toc button.on{background:rgba(56,189,248,.1);box-shadow:inset 3px 0 0 var(--accent)}
.toc .n{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 11px var(--mono);color:var(--muted)}
.toc .on .n{border-color:var(--accent);color:var(--accent)}
.toc .done .n{background:var(--ok);border-color:var(--ok);color:#06090f}
.toc .t{flex:1}
.toc .d{font-size:12px;color:var(--muted);white-space:nowrap}
.toc .d.free{color:var(--ok);font-weight:600}
.toc .lk{font-size:12px;opacity:.6}

/* เนื้อหาบท */
.prose{font-size:17px;line-height:1.9;min-width:0;color:var(--text2)}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose b{color:var(--text)}
.prose h2{font:700 23px/1.45 var(--head);color:var(--text);margin:1.5em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
.prose h3{font:700 19px/1.45 var(--head);color:var(--text);margin:1.3em 0 .4em}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose li{margin:.25em 0}
.prose li::marker{color:var(--accent)}
.prose blockquote{margin:1.3em 0;padding:14px 18px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:16px}
.prose figure{margin:1.5em 0}
.prose figure img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}
.prose figcaption{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.prose a{color:var(--accent);text-underline-offset:3px;word-break:break-word}
.prose .math{overflow-x:auto;margin:1.1em 0;text-align:center}
.embed{position:relative;margin:1.5em 0;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed.v{aspect-ratio:16/9}
.embed.doc{aspect-ratio:3/4;max-height:85vh;background:var(--surface2)}
.embed.web{aspect-ratio:4/3;background:#fff}
.embed-cap{display:flex;justify-content:flex-end;font-size:13px;margin:-1.2em 0 1.5em}
.lbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--accent);border-radius:9px;font:600 15px var(--head);text-decoration:none!important;color:var(--accent)!important}
.lbtn:hover{background:rgba(56,189,248,.12)}
.cintro{margin-top:18px;max-width:860px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 22px}

footer{margin-top:60px;border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--accent);text-decoration:none}

/* ---------- หน้าต่างล็อกอิน ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal-head{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h3{font:700 19px var(--head)}
.modal-head p{color:var(--muted);font-size:14px}
.modal-x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 8px;border-radius:8px;line-height:1}
.modal-x:hover{background:var(--surface2);color:var(--text)}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:18px 24px 0;padding:4px;background:var(--surface2);border-radius:10px}
.seg button{border:0;background:none;padding:8px;border-radius:7px;font:600 14px var(--head);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface3);color:var(--text)}
.pane{display:none;padding:20px 24px 24px;flex-direction:column;gap:12px}
.pane.on{display:flex}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;padding:11px;border-radius:10px;font:600 15px var(--head);cursor:pointer}
.gbtn:hover{background:#f1f5f9}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line2)}
.modal .btn.solid{width:100%;padding:12px}
.switch{text-align:center;font-size:14px;color:var(--muted)}
.switch button{background:none;border:0;color:var(--accent);font:600 14px var(--head);cursor:pointer}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:36px;padding:44px 0 36px}
  .mock{max-width:520px}
  .course{grid-template-columns:1fr}
  .toc{position:static;max-height:none;order:2}
  .feats,.steps{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .nav{display:none}
  .hero p.lead{font-size:16px}
  .hero .cta .btn{flex:1}
  .float{right:8px}
  .cgrid{grid-template-columns:1fr}
  .resume{grid-template-columns:1fr}
  .resume-cv{min-height:110px}
  .prose{font-size:16px}
  .lock{padding:28px 16px}
  .res .btn{flex:1}
  .band{padding:22px}
  .tb-auth .btn.ghost{display:none}
}
</style>
</head>
<body data-role="guest">

        เข้าสู่ระบบด้วย Google

      <button class="gbtn" type="button" data-google>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        สมัครด้วย Google
      </button>
      <div class="divider">หรือสมัครด้วยอีเมล</div>
      <div class="field"><label for="rg-name">ชื่อ-สกุล</label><input type="text" id="rg-name" autocomplete="name" placeholder="ด.ญ. ใจดี เรียนดี"><span class="hint">ครูจะเห็นชื่อนี้ตอนอนุมัติ</span></div>
      <div class="field"><label for="rg-email">อีเมล</label><input type="email" id="rg-email" autocomplete="email" placeholder="your@email.com"></div>
      <div class="field"><label for="rg-pass">รหัสผ่าน</label><input type="password" id="rg-pass" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร"></div>
      <div class="field"><label for="rg-pass2">ยืนยันรหัสผ่าน</label><input type="password" id="rg-pass2" autocomplete="new-password" placeholder="••••••"></div>
      <div class="err" id="rg-err"></div>
      <button class="btn solid" type="button" data-do="register">สมัครบัญชีนักเรียน</button>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=2"></script>
<script src="course-core.js?v=2"></script>
<script>
(function () {
const { esc, safeUrl, ytId, embedSrc, renderBody, typeset, splitSims, ICON } = KPC;
const $ = id => document.getElementById(id);
const SUBJ = { 'ฟิสิกส์': ['#0ea5e9', '#6366f1', 'PHYSICS'], 'ดาราศาสตร์': ['#7c3aed', '#f97316', 'ASTRONOMY'], 'เคมี': ['#0d9488', '#65a30d', 'CHEMISTRY'], 'ชีววิทยา': ['#16a34a', '#ca8a04', 'BIOLOGY'] };
const subjOf = s => SUBJ[s] || ['#475569', '#0ea5e9', 'SCIENCE'];
const fmtDate = ts => { try { const d = ts && ts.toDate ? ts.toDate() : null; return d ? d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : ''; } catch (e) { return ''; } };
function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2800); }
const courseUrl = (c, n) => '#/c/' + encodeURIComponent(c.id) + (n ? '/' + n : '');

/* ===================== สถานะ ===================== */
const S = { courses: null, listErr: '', progress: {}, request: {}, lessonCache: {} };
let renderSeq = 0, CUR = null;

async function loadCourses() {
  try { S.courses = await KPC.listCourses(); S.listErr = ''; }
  catch (e) { S.courses = []; S.listErr = e.code === 'permission-denied' ? 'ยังเปิดอ่านคอร์สไม่ได้ (ตั้งค่า Firestore rules ยังไม่เสร็จ)' : 'โหลดรายการคอร์สไม่สำเร็จ: ' + (e.message || e); }
}
async function loadUserCourseState(list) {
  if (!KPC.user()) return;
  await Promise.all(list.map(async c => {
    if (KPC.canCourse(c.id, c)) S.progress[c.id] = await KPC.getProgress(c.id);
    else S.request[c.id] = await KPC.getMyRequest(c.id);
  }));
}
const pctOf = c => { const p = S.progress[c.id], o = c.outline || []; if (!p || !o.length) return 0; return Math.round((p.done || []).filter(x => o.some(l => l.id === x)).length / o.length * 100); };
const firstFree = () => { for (const c of S.courses || []) { const j = (c.outline || []).findIndex(l => l.free); if (j >= 0) return [c, j + 1]; } return null; };

/* ===================== การ์ดคอร์ส ===================== */
function card(c) {
  const [a, b, en] = subjOf(c.subject), n = (c.outline || []).length, free = (c.outline || []).filter(l => l.free).length;
  const user = KPC.user(), ok = KPC.canCourse(c.id, c), own = KPC.ownsCourse(c), pct = pctOf(c);
  const st = !user ? (free ? '<span class="pill ok">🎁 ทดลองเรียนฟรี</span>' : '')
    : own ? '<span class="pill role">🧑‍🏫 คอร์สที่ฉันสอน</span>'
    : ok ? '<span class="pill ok">✓ เข้าเรียนได้</span>'
    : S.request[c.id] ? '<span class="pill warn">⏳ รอครูอนุมัติ</span>' : '<span class="pill">🔒 ขอสิทธิ์เรียน</span>';
  return `<a class="cc" href="${courseUrl(c)}" style="--a:${a};--b:${b}">
    <div class="cc-cv">${safeUrl(c.cover) ? `<img src="${esc(c.cover)}" alt="" loading="lazy">` : `<em>${esc(en)}</em>`}<span class="cc-st">${st}</span>${c.published === false ? '<span class="cc-dr"><span class="pill warn">ร่าง</span></span>' : ''}</div>
    <div class="cc-bd">
      <div class="cc-tags">${[c.subject, c.level].filter(Boolean).map(x => `<span class="pill">${esc(x)}</span>`).join('')}</div>
      <h3>${esc(c.title)}</h3>
      ${c.summary ? `<p>${esc(c.summary)}</p>` : ''}
      <div class="cc-meta"><span>📖 ${n} บทเรียน${free ? ` · <span class="free">ฟรี ${free} บท</span>` : ''}</span><span>${esc(c.author || '')}</span></div>
      ${ok && user && !own ? `<div class="cc-pr"><span class="bar"><i style="width:${pct}%"></i></span>${pct}%</div>` : ''}
    </div></a>`;
}
const grid = list => `<div class="cgrid">${list.map(card).join('')}</div>`;

/* ===================== หน้าแรก ===================== */
function renderHome() {
  document.title = 'คอร์สออนไลน์ · KP Science';
  setNav('home');
  $('app').innerHTML = KPC.user() ? homeUser() : homeGuest();
}

function homeGuest() {
  const L = S.courses || [], ff = firstFree();
  const tryBtn = ff ? `<a class="btn solid lg" href="${courseUrl(ff[0], ff[1])}">▶ ลองเรียนบทฟรี</a>` : '';
  return `
  <section class="hero">
    <div>
      <span class="eyebrow"><i></i>KP SCIENCE · ONLINE COURSE</span>
      <h1>เรียนฟิสิกส์<br>ให้<em>เห็นภาพ</em> ไม่ใช่แค่จำสูตร</h1>
      <p class="lead">ดูคลิปบรรยายสั้น ๆ แล้วลองปรับค่าในซิมูเลชันด้วยตัวเอง เรียนเป็นบท ตามจังหวะของตัวเอง เห็นความคืบหน้าทุกบท</p>
      <div class="cta">${tryBtn}<button class="btn lg" type="button" data-login="register">สมัครฟรี</button></div>
      <div class="trust"><span>สมัครฟรี</span><span>เรียนบนมือถือได้</span><span>มีบทให้ลองก่อน</span></div>
    </div>
    <div class="mock" aria-hidden="true">
      <div class="mock-v">
        <svg viewBox="0 0 320 180" preserveAspectRatio="none"><path d="M10 160 Q 110 -20 210 70 T 310 150" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.5" stroke-dasharray="6 6"/><circle cx="210" cy="70" r="9" fill="#fff"/><line x1="10" y1="160" x2="310" y2="160" stroke="rgba(255,255,255,.35)"/></svg>
        <span class="play">▶</span>
      </div>
      <div class="mock-b">
        <b>การเคลื่อนที่แบบโพรเจกไทล์</b>
        <div class="mock-row"><span class="on">📄 เนื้อหา</span><span>🧪 Simulation</span><span>✅ แบบทดสอบ</span></div>
        <div class="mock-p"><span class="bar"><i style="width:75%"></i></span>เรียนแล้ว 3/4 บท</div>
      </div>
      <div class="float">✓ <b>บันทึกแล้ว</b> — เก่งมาก!</div>
    </div>
  </section>

  <section class="sec">
    <div class="feats">
      <div class="feat"><div class="fi">🎬</div><h3>คลิปสั้น ตรงประเด็น</h3><p>บทละไม่กี่นาที ดูซ้ำได้ไม่จำกัด หยุดตรงไหนกลับมาเรียนต่อได้</p></div>
      <div class="feat"><div class="fi">🧪</div><h3>ซิมูเลชันลองเองได้</h3><p>ปรับมุม ความเร็ว แรง แล้วดูผลทันที เข้าใจที่มาของสูตร</p></div>
      <div class="feat"><div class="fi">📈</div><h3>เห็นความคืบหน้า</h3><p>ติ๊กบทที่เรียนจบ ระบบจำบทล่าสุดให้ ครูก็ช่วยติดตามได้</p></div>
    </div>
  </section>

  <section class="sec" id="all">
    <div class="sec-h"><div><h2>คอร์สที่เปิดสอน</h2><p>บทที่มีป้าย <span class="pill ok">ฟรี</span> เปิดดูได้เลยไม่ต้องสมัคร</p></div></div>
    ${L.length ? grid(L) : `<div class="empty"><span class="ic">📚</span>${esc(S.listErr || 'ยังไม่มีคอร์สที่เปิดสอน — เร็ว ๆ นี้')}</div>`}
  </section>

  <section class="sec">
    <div class="sec-h"><h2>เริ่มเรียนใน 3 ขั้น</h2></div>
    <div class="steps">
      <div class="step"><h3>สมัครบัญชีฟรี</h3><p>ใช้ Google หรืออีเมลก็ได้ ใช้เวลาไม่ถึงนาที</p></div>
      <div class="step"><h3>กดขอสิทธิ์เรียน</h3><p>เลือกคอร์ส บอกครูว่าเป็นใคร (ชื่อ · ห้อง · โรงเรียน)</p></div>
      <div class="step"><h3>ครูอนุมัติ เริ่มเรียนได้เลย</h3><p>ทุกบทเปิดให้ เรียนต่อจากบทล่าสุดได้ทุกเครื่อง</p></div>
    </div>
  </section>

  <section class="sec"><div class="band"><div><h3>พร้อมเริ่มแล้วใช่ไหม</h3><p>สมัครฟรี แล้วขอสิทธิ์คอร์สที่สนใจ</p></div><span class="sp"></span>${ff ? `<a class="btn" href="${courseUrl(ff[0], ff[1])}">ลองบทฟรีก่อน</a>` : ''}<button class="btn solid" type="button" data-login="register">สมัครฟรี</button></div></section>`;
}

function homeUser() {
  const L = S.courses || [], role = KPC.role;
  const teach = L.filter(c => KPC.ownsCourse(c) && role === 'teacher');
  const mine = L.filter(c => KPC.canCourse(c.id, c) && !teach.includes(c) && role !== 'admin');
  const pending = L.filter(c => !KPC.canCourse(c.id, c) && S.request[c.id]);
  const others = L.filter(c => !mine.includes(c) && !teach.includes(c) && !pending.includes(c));
  // บทล่าสุดที่เปิด (คอร์สที่ last ใหม่สุด)
  const last = mine.map(c => ({ c, p: S.progress[c.id] })).filter(x => x.p && x.p.last)
    .sort((x, y) => ((y.p.lastAt && y.p.lastAt.seconds) || 0) - ((x.p.lastAt && x.p.lastAt.seconds) || 0))[0];
  const name = KPC.displayName();
  let resume = '';
  if (last || mine[0]) {
    const c = last ? last.c : mine[0], o = c.outline || [];
    const j = last ? Math.max(0, o.findIndex(l => l.id === last.p.last)) : 0;
    const [a, b] = subjOf(c.subject), pct = pctOf(c);
    resume = `<a class="resume" href="${courseUrl(c, j + 1)}" style="--a:${a};--b:${b}">
      <div class="resume-cv"><span class="play">▶</span></div>
      <div class="resume-bd"><small>${last ? 'เรียนต่อจากครั้งก่อน' : 'เริ่มเรียนได้เลย'}</small><h3>${esc((o[j] || {}).title || c.title)}</h3>
        <div class="meta">${esc(c.title)} · บทที่ ${j + 1}/${o.length}</div>
        <div class="pr"><span class="bar"><i style="width:${pct}%"></i></span><span>${pct}%</span></div></div></a>`;
  }
  const staff = KPC.isStaff() ? `<div class="staffbar"><span class="pill role">${KPC.ROLE[role].icon} ${KPC.ROLE[role].label}</span><span>${role === 'admin' ? 'คุณดูเว็บนี้ในฐานะแอดมิน — เห็นทุกคอร์ส รวมถึงร่าง' : 'คุณดูเว็บนี้ในฐานะครู — เปิดบทเรียนของคอร์สที่สอนได้ทุกบท'}</span><span class="sp"></span><a class="btn sm" href="admin.html">ไปห้องครู →</a></div>` : '';
  const hello = new Date().getHours() < 12 ? 'สวัสดีตอนเช้า' : new Date().getHours() < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น';
  return `
  <section class="dash-h"><div><h1>${hello}, ${esc(name)} 👋</h1><p>${mine.length ? `คุณมี ${mine.length} คอร์สที่เรียนได้` : role === 'student' ? 'ยังไม่มีคอร์ส — เลือกคอร์สด้านล่างแล้วกดขอสิทธิ์เรียน' : ''}</p></div></section>
  ${staff}
  ${resume ? `<section class="sec" style="padding-top:22px">${resume}</section>` : ''}
  ${teach.length ? `<section class="sec"><div class="sec-h"><h2>คอร์สที่ฉันสอน</h2><a class="btn sm" href="admin.html">จัดการคอร์ส →</a></div>${grid(teach)}</section>` : ''}
  ${mine.length ? `<section class="sec"><div class="sec-h"><h2>คอร์สของฉัน</h2></div>${grid(mine)}</section>` : ''}
  ${pending.length ? `<section class="sec"><div class="sec-h"><div><h2>รอครูอนุมัติ</h2><p>ครูจะอนุมัติให้เร็ว ๆ นี้ — กด “ตรวจอีกครั้ง” เพื่ออัปเดต</p></div><button class="btn sm" type="button" data-recheck>🔄 ตรวจอีกครั้ง</button></div>
    <div class="pend">${pending.map(c => `<div class="pend-i"><span class="pill warn">⏳ รออนุมัติ</span><b>${esc(c.title)}</b><span class="sub">ส่งเมื่อ ${esc(fmtDate(S.request[c.id].createdAt) || 'เมื่อสักครู่')}</span><span class="sp"></span><a class="btn xs" href="${courseUrl(c)}">ดูคอร์ส</a></div>`).join('')}</div></section>` : ''}
  ${others.length ? `<section class="sec"><div class="sec-h"><div><h2>${mine.length || teach.length || role === 'admin' ? (role === 'admin' ? 'คอร์สทั้งหมด' : 'คอร์สอื่นที่เปิดสอน') : 'เลือกคอร์สที่อยากเรียน'}</h2>${role === 'student' ? '<p>เปิดคอร์สแล้วกด “ขอสิทธิ์จากครู”</p>' : ''}</div></div>${grid(others)}</section>` : ''}
  ${!L.length ? `<div class="empty" style="margin-top:24px"><span class="ic">📚</span>${esc(S.listErr || 'ยังไม่มีคอร์สที่เปิดสอน')}</div>` : ''}`;
}

function renderAll() {

/* ===================== หน้าคอร์ส ===================== */
const L_ICON = { text: '📄', sim: '🧪', doc: '📑', quiz: '✅' };

function tocHtml(c, i) {
  const outline = c.outline || [], done = (S.progress[c.id] || {}).done || [], ok = KPC.canCourse(c.id, c), track = ok && KPC.user() && !KPC.ownsCourse(c);
  const pct = pctOf(c), units = [];
  outline.forEach((l, j) => { const u = l.unit || ''; if (!units.length || units[units.length - 1].name !== u) units.push({ name: u, items: [] }); units[units.length - 1].items.push([l, j]); });
  const row = ([l, j]) => {
    const d = done.includes(l.id), locked = !ok && !l.free;
    return `<button type="button" class="${j === i ? 'on' : ''}${d ? ' done' : ''}" data-go="${courseUrl(c, j + 1)}"><span class="n">${d ? '✓' : j + 1}</span><span class="t">${esc(l.title)}</span>${locked ? '<span class="lk" aria-label="ล็อก">🔒</span>' : !ok && l.free ? '<span class="d free">ฟรี</span>' : l.dur ? `<span class="d">${esc(l.dur)}</span>` : ''}</button>`;
  };
  return `<div class="toc-h"><b><span>สารบัญ · ${outline.length} บท</span>${track ? `<small>${pct}%</small>` : ''}</b>${track ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</div>
    ${units.map((u, ui) => u.name ? `<details class="unit"${u.items.some(([, j]) => j === i) || units.length < 4 ? ' open' : ''}><summary><span class="un">${String(ui + 1).padStart(2, '0')}</span><span class="ut">${esc(u.name.replace(/^\d+\s*[.·:-]?\s*/, ''))}</span><small>${u.items.length} บท</small></summary>${u.items.map(row).join('')}</details>` : u.items.map(row).join('')).join('')}`;
}

function lockPanel(c) {
  const user = KPC.user(), req = S.request[c.id];
  let inner;
  if (!user) inner = `<div class="ic">🔑</div><h3>สมัครฟรีเพื่อเรียนบทนี้</h3><p>บทนี้สำหรับนักเรียนในคอร์ส สมัครบัญชีฟรี แล้วกด “ขอสิทธิ์จากครู” ระหว่างนี้ลองบทที่มีป้ายฟรีในสารบัญได้เลย</p><div class="row"><button class="btn solid" type="button" data-login="register">สมัครฟรี</button><button class="btn" type="button" data-login="login">มีบัญชีแล้ว · เข้าสู่ระบบ</button></div>`;
  else if (req) inner = `<div class="ic">⏳</div><h3>ส่งคำขอแล้ว — รอครูอนุมัติ</h3><p>ส่งเมื่อ ${esc(fmtDate(req.createdAt) || 'เมื่อสักครู่')} ในชื่อ <b>${esc(user.email)}</b> ครูอนุมัติแล้วบทเรียนจะเปิดให้ทันที</p><div class="row"><button class="btn solid sm" type="button" data-recheck>🔄 ตรวจสิทธิ์อีกครั้ง</button><button class="btn bad sm" type="button" data-cancel="${esc(c.id)}">ยกเลิกคำขอ</button></div>`;
  else inner = `<div class="ic">🔒</div><h3>ขอสิทธิ์เรียนคอร์สนี้</h3><p>บอกครูสั้น ๆ ว่าเป็นใคร แล้วกดขอสิทธิ์ ครูจะอนุมัติให้บัญชี <b>${esc(user.email)}</b></p>
    <textarea id="reqNote" maxlength="300" placeholder="เช่น ด.ญ. ใจดี เรียนดี ม.4/2 โรงเรียน…" aria-label="ข้อความถึงครู"></textarea>
    <div class="row"><button class="btn solid" type="button" data-request="${esc(c.id)}">🙋 ขอสิทธิ์จากครู</button></div>`;
  return `<div class="lock">${inner}</div>`;
}

async function renderCourse(cid, n) {
  const seq = ++renderSeq;
  setNav('courses');
  let c = (S.courses || []).find(x => x.id === cid);
  if (!c) {
    $('app').innerHTML = '<div class="view"><div class="skel" style="width:40%"></div><div class="skel"></div></div>';
    try { c = await KPC.getCourse(cid); } catch (e) { c = null; }
    if (seq !== renderSeq) return;
    if (!c) { $('app').innerHTML = `<div class="view">${crumb()}<div class="empty"><span class="ic">🔎</span>ไม่พบคอร์สนี้ หรือคอร์สยังไม่เปิด</div></div>`; return; }
  }
  if (KPC.user() && !(cid in S.progress) && !(cid in S.request)) await loadUserCourseState([c]);
  const outline = c.outline || [];
  const i = Math.min(Math.max(0, (Number(n) || 1) - 1), Math.max(0, outline.length - 1));
  const meta = outline[i], ok = KPC.canCourse(cid, c);
  let L = null;
  if (meta && (ok || meta.free)) {
    const key = cid + '/' + meta.id;
    L = S.lessonCache[key];
    if (!L) {
      $('app').innerHTML = `<div class="view">${head(c)}<div class="skel" style="margin-top:30px;height:260px"></div></div>`;
      try { L = await KPC.getLesson(cid, meta.id); } catch (e) { L = null; }
      if (seq !== renderSeq) return;
      if (L) S.lessonCache[key] = L;
    }
  }
  document.title = c.title + ' · KP Science';
  $('app').innerHTML = `<div class="view">${viewCourse(c, i, meta, L, ok)}</div>`;
  typeset($('app'));
  // บันทึกว่าเรียนถึงบทไหน (ครูดูในห้องครู) — เฉพาะนักเรียน
  if (ok && L && KPC.user() && !KPC.ownsCourse(c)) {
    const p = S.progress[cid] = S.progress[cid] || { done: [] };
    if (p.last !== meta.id) { p.last = meta.id; p.lastAt = { seconds: Date.now() / 1000 }; KPC.saveProgress(c, { last: meta.id, lastAt: firebase.firestore.FieldValue.serverTimestamp(), total: outline.length, done: p.done || [] }).catch(() => {}); }
  }
}

const crumb = c => `<div class="crumb"><a href="#/">หน้าแรก</a>›<a href="#/courses">คอร์สทั้งหมด</a>${c ? '›<span>' + esc(c.title) + '</span>' : ''}</div>`;
function head(c) {
  return `${crumb(c)}
    <div class="c-head"><div>
      <div class="c-tags">${[c.subject, c.level].filter(Boolean).map(x => `<span class="pill">${esc(x)}</span>`).join('')}${c.published === false ? '<span class="pill warn">ร่าง</span>' : ''}${KPC.ownsCourse(c) ? '<span class="pill role">🧑‍🏫 คอร์สที่คุณดูแล</span>' : ''}</div>
      <h1>${esc(c.title)}</h1>
      ${c.summary ? `<p class="c-sum">${esc(c.summary)}</p>` : ''}
      <div class="c-by">${c.author ? 'โดย ' + esc(c.author) + ' · ' : ''}${(c.outline || []).length} บทเรียน</div>
    </div>${KPC.ownsCourse(c) ? `<a class="btn sm" href="admin.html#/c/${encodeURIComponent(c.id)}">✏️ แก้คอร์สนี้</a>` : ''}</div>`;
}

function viewCourse(c, i, meta, L, ok) {
  const [a, b] = subjOf(c.subject);
  const intro = i === 0 && c.body ? `<div class="prose cintro">${renderBody(c.body)}</div>` : '';
  CUR = { c, i };
  if (!meta) return `${head(c)}${intro}<div class="empty" style="margin-top:20px"><span class="ic">📝</span>คอร์สนี้ยังไม่มีบทเรียน</div>`;
  const outline = c.outline;
  const nav = `<span class="pn">${i > 0 ? `<a class="btn sm" href="${courseUrl(c, i)}">← ก่อนหน้า</a>` : ''}${i < outline.length - 1 ? `<a class="btn sm solid" href="${courseUrl(c, i + 2)}">บทถัดไป →</a>` : ''}</span>`;
  const lh = `<div class="ls-h"><small>บทที่ ${i + 1} / ${outline.length}${meta.unit ? ' · ' + esc(meta.unit) : ''}</small><h2>${esc(meta.title)}</h2></div>`;
  let main;
  if (!L) {
    main = `${lockPanel(c)}${lh}<div class="ls-nav"><span></span>${nav}</div>`;
  } else {
    const { sims, text } = splitSims(L.body);
    const embSims = sims.filter(s => !KPC.noEmbed(s.url));
    const file = safeUrl(L.file), quiz = safeUrl(L.quiz);
    const player = L.video && ytId(L.video) ? `<div class="player"><iframe src="${esc(embedSrc(L.video))}" allow="fullscreen; encrypted-media; picture-in-picture" allowfullscreen title="${esc(L.title)}"></iframe></div>`
      : embSims.length ? `<div class="player"><iframe src="${esc(embedSrc(embSims[0].url))}" loading="lazy" allowfullscreen title="${esc(L.title)}"></iframe></div>`
      : `<div class="player ph" style="--a:${a};--b:${b}"><div><small>บทที่ ${i + 1}</small><b>${esc(L.title)}</b></div></div>`;
    const tabs = [['text', 'เนื้อหา', true], ['sim', `Simulation${sims.length > 1 ? ' (' + sims.length + ')' : ''}`, sims.length], ['doc', 'เอกสาร', file], ['quiz', 'แบบทดสอบ', quiz]].filter(t => t[2]);
    const first = text ? 'text' : (tabs.find(t => t[0] !== 'text') || ['text'])[0];
    const panel = {
      text: `<div class="prose">${renderBody(text) || '<p style="color:var(--muted)">บทนี้เรียนจากคลิป/ซิมูเลชันด้านบน</p>'}</div>`,
      sim: sims.map((x, j) => `<div class="res"><span class="ri">${L_ICON.sim}</span><span><b>${esc(x.label || 'Simulation ' + (j + 1))}</b><small>${KPC.noEmbed(x.url) ? 'Virtual Lab · เปิดในแท็บใหม่' : 'ซิมูเลชันโต้ตอบ ปรับค่าได้เอง'}</small></span><span class="sp"></span>
        ${KPC.noEmbed(x.url) ? '' : `<button type="button" class="btn sm" data-play="${esc(embedSrc(x.url))}">แสดงบนจอ</button>`}<a class="btn sm" href="${esc(x.url)}" target="_blank" rel="noopener">เต็มจอ ${ICON.out}</a></div>`).join(''),
      doc: file ? `<div class="embed doc" style="margin-top:0"><iframe src="${esc(embedSrc(file))}" loading="lazy" title="เอกสารประกอบ"></iframe></div><div class="embed-cap"><a href="${esc(file)}" target="_blank" rel="noopener">เปิดเอกสารในแท็บใหม่ ${ICON.out}</a></div>` : '',
      quiz: quiz ? `<div class="res"><span class="ri">${L_ICON.quiz}</span><span><b>แบบทดสอบท้ายบท</b><small>ทำแล้วส่งได้ทันที</small></span><span class="sp"></span><a class="btn sm solid" href="${esc(quiz)}" target="_blank" rel="noopener">ทำแบบทดสอบ ${ICON.out}</a></div>` : '',
    };
    const done = ((S.progress[c.id] || {}).done || []).includes(L.id);
    const check = KPC.ownsCourse(c) ? '<span class="freenote">มุมมองครู · นักเรียนจะเห็นปุ่ม “เรียนบทนี้แล้ว” ตรงนี้</span>'
      : ok && KPC.user() ? `<button type="button" class="donebtn${done ? ' on' : ''}" data-done="${esc(L.id)}" aria-pressed="${done}"><span class="bx">✓</span>${done ? 'เรียนบทนี้แล้ว' : 'ทำเครื่องหมายว่าเรียนแล้ว'}</button>`
      : `<span class="freenote">🎁 บทเรียนทดลองฟรี${KPC.user() ? '' : ' · <button type="button" class="btn xs" data-login="register">สมัครฟรี</button> เพื่อเรียนบทอื่นและบันทึกความคืบหน้า'}</span>`;
    main = `${player}${lh}
      <div class="ls-meta">${[c.subject, c.level, L.dur && '⏱ ' + L.dur].filter(Boolean).map(x => `<span class="pill">${esc(x)}</span>`).join('')}${!ok && L.free ? '<span class="pill ok">ทดลองเรียนฟรี</span>' : ''}</div>
      ${tabs.length > 1 ? `<div class="ltabs" role="tablist">${tabs.map(t => `<button type="button" role="tab" data-ltab="${t[0]}" class="${t[0] === first ? 'on' : ''}">${L_ICON[t[0]]} ${esc(t[1])}</button>`).join('')}</div>` : ''}
      ${tabs.map(t => `<div class="lpanel" data-lpanel="${t[0]}"${t[0] === first ? '' : ' hidden'}>${panel[t[0]]}</div>`).join('')}
      <div class="ls-nav">${check}${nav}</div>`;
  }
  return `${head(c)}${intro}<div class="course"><div>${main}</div><nav class="toc" id="toc" aria-label="สารบัญ">${tocHtml(c, i)}</nav></div>`;
}

/* ===================== เหตุการณ์ ===================== */
async function recheck() {
  await KPC.refreshMe(); S.progress = {}; S.request = {}; S.lessonCache = {};
  await loadUserCourseState(S.courses || []);
  route();
  if (CUR && location.hash.startsWith('#/c/')) toast(KPC.canCourse(CUR.c.id, CUR.c) ? '🎉 ครูอนุมัติแล้ว เข้าเรียนได้เลย' : 'ยังรอครูอนุมัติอยู่');
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-ltab]');
  if (t) {
    document.querySelectorAll('[data-ltab]').forEach(x => x.classList.toggle('on', x === t));
    document.querySelectorAll('[data-lpanel]').forEach(p => { p.hidden = p.dataset.lpanel !== t.dataset.ltab; });
    typeset(document.querySelector(`[data-lpanel="${t.dataset.ltab}"]`));
    return;
  }
  const pl = e.target.closest('[data-play]');
  if (pl) {
    const box = document.querySelector('.player');
    box.className = 'player'; box.removeAttribute('style');
    box.innerHTML = `<iframe src="${esc(pl.dataset.play)}" allowfullscreen title="Simulation"></iframe>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const lg = e.target.closest('[data-login]'); if (lg) { openLogin(lg.dataset.login); return; }
  if (e.target.closest('[data-logout]')) { closeMenu(); KPC.logout(); toast('ออกจากระบบแล้ว'); location.hash = '#/'; return; }
  const go = e.target.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
  const rq = e.target.closest('[data-request]');
  if (rq) {
    const c = S.courses.find(x => x.id === rq.dataset.request) || (CUR && CUR.c);
    rq.disabled = true; rq.textContent = 'กำลังส่ง…';
    try {
      await KPC.requestAccess(c, ($('reqNote') || {}).value || '');
      S.request[c.id] = await KPC.getMyRequest(c.id) || { createdAt: null };
      toast('ส่งคำขอถึงครูแล้ว');
      route();
    } catch (err) { rq.disabled = false; rq.textContent = '🙋 ขอสิทธิ์จากครู'; toast('ส่งไม่สำเร็จ: ' + (err.code || err.message), true); }
    return;
  }
  const cn = e.target.closest('[data-cancel]');
  if (cn) {
    if (!confirm('ยกเลิกคำขอสิทธิ์คอร์สนี้?')) return;
    try { await KPC.cancelRequest(cn.dataset.cancel); delete S.request[cn.dataset.cancel]; toast('ยกเลิกคำขอแล้ว'); route(); } catch (err) { toast('ไม่สำเร็จ: ' + (err.code || err.message), true); }
    return;
  }
  if (e.target.closest('[data-recheck]')) { recheck(); return; }
  const dn = e.target.closest('[data-done]');
  if (dn && CUR) {
    const c = CUR.c, lid = dn.dataset.done;
    const p = S.progress[c.id] = S.progress[c.id] || { done: [] };
    const on = !(p.done || []).includes(lid);
    const list = (p.done || []).filter(x => x !== lid); if (on) list.push(lid);
    p.done = list;
    dn.classList.toggle('on', on); dn.setAttribute('aria-pressed', on);
    dn.lastChild.textContent = on ? 'เรียนบทนี้แล้ว' : 'ทำเครื่องหมายว่าเรียนแล้ว';
    if ($('toc')) $('toc').innerHTML = tocHtml(c, CUR.i);
    KPC.saveProgress(c, { done: list, total: (c.outline || []).length })
      .then(() => { if (on) toast(list.length >= (c.outline || []).length ? '🎉 เรียนครบทุกบทแล้ว!' : 'บันทึกแล้ว — เก่งมาก!'); })
      .catch(err => toast('บันทึกไม่สำเร็จ: ' + (err.code || err.message), true));
  }
});

/* ---------- เส้นทาง: #/ · #/courses · #/c/รหัส · #/c/รหัส/บทที่ ---------- */
function setNav(k) { $('navHome').classList.toggle('on', k === 'home'); $('navCourses').classList.toggle('on', k === 'courses'); }
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = /^[/]c[/]([^/]+)(?:[/](\d+))?/.exec(h);
  if (m) renderCourse(m[1], m[2]);
  else { renderSeq++; if (h === '/courses') renderAll(); else renderHome(); }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

/* ===================== ล็อกอิน ===================== */
function openLogin(tab) { $('loginModal').classList.add('open'); loginTab(tab || 'login'); setTimeout(() => { const f = $(tab === 'register' ? 'rg-name' : 'li-email'); if (f) f.focus(); }, 50); }
function closeLogin() { $('loginModal').classList.remove('open'); ['li-err', 'rg-err'].forEach(i => { $(i).textContent = ''; $(i).style.color = ''; }); }
function loginTab(tab) {
  ['login', 'register'].forEach(t => { $('seg-' + t).classList.toggle('on', t === tab); $('pane-' + t).classList.toggle('on', t === tab); });
  $('loginTitle').textContent = tab === 'register' ? 'สมัครบัญชีนักเรียน' : 'ยินดีต้อนรับกลับ 👋';
}
async function run(errId, fn) {
  const el = $(errId); el.style.color = 'var(--muted)'; el.textContent = 'กำลังดำเนินการ…';
  try { await fn(); el.textContent = ''; closeLogin(); }
  catch (e) { el.style.color = ''; el.textContent = e.code === 'auth/popup-closed-by-user' ? '' : KPC.authError(e.code || e.message); }
}
$('loginModal').addEventListener('click', e => {
  if (e.target.id === 'loginModal' || e.target.closest('[data-close]')) return closeLogin();
  const tb = e.target.closest('[data-tab]'); if (tb) return loginTab(tb.dataset.tab);
  if (e.target.closest('[data-google]')) return run($('pane-register').classList.contains('on') ? 'rg-err' : 'li-err', KPC.loginGoogle);
  const d = e.target.closest('[data-do]'); if (!d) return;
  if (d.dataset.do === 'login') {
    const em = $('li-email').value.trim(), pw = $('li-pass').value;
    if (!em || !pw) { $('li-err').textContent = 'กรุณากรอกอีเมลและรหัสผ่าน'; return; }
    run('li-err', () => KPC.loginEmail(em, pw));
  } else if (d.dataset.do === 'register') {
    const name = $('rg-name').value.trim(), em = $('rg-email').value.trim(), pw = $('rg-pass').value, pw2 = $('rg-pass2').value, err = $('rg-err');
    if (!name || !em || !pw) { err.textContent = 'กรุณากรอกชื่อ อีเมล และรหัสผ่าน'; return; }
    if (pw !== pw2) { err.textContent = 'รหัสผ่านไม่ตรงกัน'; return; }
    if (pw.length < 6) { err.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return; }
    run('rg-err', () => KPC.register(em, pw, name));
  } else if (d.dataset.do === 'reset') {
    const em = $('li-email').value.trim(), err = $('li-err');
    if (!em) { err.style.color = ''; err.textContent = 'พิมพ์อีเมลในช่องด้านบนก่อน แล้วกด “ลืมรหัสผ่าน?” อีกครั้ง'; return; }
    KPC.resetPassword(em).then(() => { err.style.color = 'var(--ok)'; err.textContent = 'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ ' + em + ' แล้ว'; })
      .catch(e2 => { err.style.color = ''; err.textContent = KPC.authError(e2.code); });
  }
});
$('loginModal').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const pane = e.target.closest('.pane'); pane.querySelector('[data-do]').click();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLogin(); closeMenu(); } });

/* ---------- เมนูผู้ใช้ ---------- */
function closeMenu() { $('who').classList.remove('open'); $('whoBtn').setAttribute('aria-expanded', 'false'); }
$('whoBtn').addEventListener('click', e => { e.stopPropagation(); const o = $('who').classList.toggle('open'); $('whoBtn').setAttribute('aria-expanded', o); });
document.addEventListener('click', e => { if (!e.target.closest('#who')) closeMenu(); });
$('whoMenu').addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });

function updateTopbar(user) {
  const role = KPC.role, R = KPC.ROLE[role];
  document.body.dataset.role = role;
  $('guestBtns').classList.toggle('hide', !!user);
  $('who').classList.toggle('hide', !user);
  if (!user) return;
  const name = KPC.displayName();
  $('whoAv').textContent = (name || '?').trim().charAt(0).toUpperCase();
  $('whoName').textContent = name;
  $('whoRole').textContent = R.icon + ' ' + R.label;
  $('mName').textContent = name;
  $('mEmail').textContent = user.email || '';
  $('mStaff').classList.toggle('hide', !KPC.isStaff());
  $('mStaff').textContent = role === 'admin' ? '👑 ห้องครู (แอดมิน)' : '🧑‍🏫 ห้องครู';
}

// เริ่ม + เมื่อเข้า/ออกจากระบบ → โหลดบทบาท + สิทธิ์ แล้ววาดใหม่
if (!KPC.configured) {
  $('app').innerHTML = '<section class="dash-h"><div><h1>⚙️ ตั้งค่าเว็บ</h1><p>ยังไม่ได้ใส่ค่า Firebase ของเว็บคอร์ส — เปิดไฟล์ <b>firebase-config.js</b> แล้ววาง firebaseConfig ของโปรเจกต์คอร์ส</p></div></section>';
} else {
  let firstAuth = true;
  KPC.onUser(async user => {
    updateTopbar(user);
    if (!firstAuth) { S.progress = {}; S.request = {}; S.lessonCache = {}; if (user) toast('เข้าสู่ระบบแล้ว · ' + KPC.ROLE[KPC.role].label); }
    firstAuth = false;
    await loadCourses();
    await loadUserCourseState(S.courses || []);
    route();
  });
}
})();
</script>
